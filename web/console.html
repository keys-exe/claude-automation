<title>Beat Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#EFF1EE; --surface:#FFFFFF; --surface-2:#F7F8F6; --surface-3:#E8EBE6;
  --ink:#15181B; --muted:#5A626B; --rule:#D5D9D3; --rule-strong:#B9BFB8;
  --accent:#2E3AA8; --accent-ink:#FFFFFF; --accent-soft:#E5E7F6;
  --pass:#1C6B45; --pass-bg:#E2EFE8;
  --warn:#8A5A00; --warn-bg:#F5EBD8;
  --fail:#A8271F; --fail-bg:#F6E3E1;
  --shadow:0 1px 2px rgba(20,24,28,.06), 0 8px 24px -16px rgba(20,24,28,.35);
  --display:'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --body:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1114; --surface:#161A1E; --surface-2:#1C2126; --surface-3:#252B31;
    --ink:#E7EAE6; --muted:#98A1A9; --rule:#2A3138; --rule-strong:#3C444C;
    --accent:#939CF2; --accent-ink:#11131F; --accent-soft:#232842;
    --pass:#63CC97; --pass-bg:#16291F;
    --warn:#E2AC55; --warn-bg:#2C2314;
    --fail:#F0837A; --fail-bg:#2E1A18;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#0E1114; --surface:#161A1E; --surface-2:#1C2126; --surface-3:#252B31;
  --ink:#E7EAE6; --muted:#98A1A9; --rule:#2A3138; --rule-strong:#3C444C;
  --accent:#939CF2; --accent-ink:#11131F; --accent-soft:#232842;
  --pass:#63CC97; --pass-bg:#16291F;
  --warn:#E2AC55; --warn-bg:#2C2314;
  --fail:#F0837A; --fail-bg:#2E1A18;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--display); margin:0; text-wrap:balance; letter-spacing:-.01em}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.sec{font-family:var(--mono); font-size:11px; color:var(--muted)}

/* header */
header{
  position:sticky; top:env(safe-area-inset-top, 0px); z-index:20;
  background:var(--surface); border-bottom:1px solid var(--rule);
  display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px;
  padding-block:10px; padding-left:16px; padding-right:16px;
}
.brand{display:flex; align-items:baseline; gap:10px; margin-right:auto; min-width:0}
.brand h1{font-size:16px; font-weight:700; letter-spacing:-.02em}
.chip{
  font-family:var(--mono); font-size:11px; padding:3px 7px; border-radius:3px;
  border:1px solid var(--rule); background:var(--surface-2); color:var(--muted);
  white-space:nowrap;
}
.chip.ok{color:var(--pass); background:var(--pass-bg); border-color:transparent}
.chip.warn{color:var(--warn); background:var(--warn-bg); border-color:transparent}
.chip.bad{color:var(--fail); background:var(--fail-bg); border-color:transparent}
.btn{
  background:var(--surface-2); border:1px solid var(--rule-strong); border-radius:4px;
  padding:5px 11px; font-size:13px; font-weight:500; cursor:pointer;
}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45; cursor:not-allowed}

/* shell */
.shell{
  display:grid; grid-template-columns:216px minmax(0,1fr) 330px; gap:0;
  align-items:start; min-height:0;
}
@media (max-width:1100px){ .shell{grid-template-columns:minmax(0,1fr)} }

/* step rail */
.rail{
  border-right:1px solid var(--rule); background:var(--surface);
  min-height:calc(100dvh - 53px - env(safe-area-inset-top, 0px));
  padding-block:14px; padding-left:16px; padding-right:12px;
  position:sticky; top:calc(52px + env(safe-area-inset-top, 0px));
}
.rail h2{font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); margin-bottom:10px}
.steps{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:1px}
.step{display:grid; grid-template-columns:18px 1fr; gap:8px; align-items:start; padding:5px 6px; border-radius:4px}
.step .n{font-family:var(--mono); font-size:11px; color:var(--muted); padding-top:1px}
.step .t{font-size:12.5px; line-height:1.35}
.step small{display:block; font-family:var(--mono); font-size:10px; color:var(--muted)}
.step.gate{background:var(--accent-soft)}
.step.gate .t{font-weight:600}
.step.live{background:var(--surface-3)}
@media (max-width:1100px){
  .rail{position:static; border-right:0; border-bottom:1px solid var(--rule); padding-right:16px; min-height:0}
  .steps{flex-direction:row; overflow-x:auto; gap:6px; padding-bottom:4px}
  .step{min-width:168px; border:1px solid var(--rule)}
}

/* center */
main{padding-block:16px; padding-left:16px; padding-right:16px; min-width:0}
.tabs{display:flex; flex-wrap:wrap; gap:4px; margin-bottom:14px}
.tab{
  background:transparent; border:1px solid transparent; border-radius:4px;
  padding:5px 10px; font-size:13px; font-weight:500; color:var(--muted); cursor:pointer;
}
.tab:hover{background:var(--surface-2); color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface); border-color:var(--rule); color:var(--ink); box-shadow:var(--shadow)}
.tab .badge{font-family:var(--mono); font-size:10px; margin-left:6px; color:var(--muted)}
.panel{background:var(--surface); border:1px solid var(--rule); border-radius:6px; box-shadow:var(--shadow)}
.panel-hd{
  display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px;
  padding:11px 14px; border-bottom:1px solid var(--rule);
}
.panel-hd h3{font-size:13px; font-weight:600; margin-right:auto}
.panel-bd{padding:14px}
.hint{color:var(--muted); font-size:12.5px; margin:0 0 12px; max-width:62ch}
.hint code{font-family:var(--mono); font-size:11.5px; background:var(--surface-2); padding:1px 4px; border-radius:3px}

textarea, input[type=text], select{
  width:100%; background:var(--surface-2); color:var(--ink);
  border:1px solid var(--rule); border-radius:4px; padding:8px 10px;
}
textarea{font-family:var(--mono); font-size:12.5px; line-height:1.6; resize:vertical; min-height:120px}
input[type=text]{font-family:var(--mono); font-size:12px; padding:5px 7px}
select{font-size:12px; padding:5px 6px; width:auto}

.tablewrap{overflow-x:auto; border:1px solid var(--rule); border-radius:5px}
table{border-collapse:collapse; width:100%; font-size:12.5px}
th{
  text-align:left; font-family:var(--mono); font-size:10px; font-weight:500;
  text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
  padding:7px 9px; border-bottom:1px solid var(--rule); background:var(--surface-2);
  position:sticky; top:0; white-space:nowrap;
}
td{padding:6px 9px; border-bottom:1px solid var(--rule); vertical-align:top}
tr:last-child td{border-bottom:0}
td.id{font-family:var(--mono); font-size:11.5px; color:var(--muted); white-space:nowrap}
td.txt{min-width:220px; max-width:430px}
tr.bad td{background:var(--fail-bg)}
tr.blocked td{background:var(--warn-bg)}
.trig{display:inline-block; font-family:var(--mono); font-size:9.5px; color:var(--muted); border:1px solid var(--rule); border-radius:3px; padding:0 4px; margin:1px 3px 1px 0}
.trig.review{color:var(--warn); border-color:currentColor}

.recon{
  font-family:var(--mono); font-size:11.5px; line-height:1.7;
  padding:10px 12px; border-radius:5px; border-left:3px solid var(--pass);
  background:var(--pass-bg); color:var(--pass); overflow-wrap:anywhere;
}
.recon.bad{border-left-color:var(--fail); background:var(--fail-bg); color:var(--fail)}

/* gates */
.gates{
  border-left:1px solid var(--rule); background:var(--surface);
  min-height:calc(100dvh - 53px - env(safe-area-inset-top, 0px));
  padding-block:16px; padding-left:14px; padding-right:16px;
  position:sticky; top:calc(52px + env(safe-area-inset-top, 0px));
  max-height:calc(100dvh - 52px); overflow-y:auto;
}
@media (max-width:1100px){
  .gates{position:static; border-left:0; border-top:1px solid var(--rule); max-height:none; min-height:0; padding-left:16px}
}
.gates h2{font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); margin-bottom:4px}
.gates .sub{font-family:var(--mono); font-size:11px; color:var(--muted); margin-bottom:12px}
.gate{display:grid; grid-template-columns:44px 1fr; gap:9px; padding:8px 0; border-top:1px solid var(--rule)}
.gate:first-of-type{border-top:0}
.gate .st{font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.04em; padding-top:2px}
.gate .st.PASS{color:var(--pass)} .gate .st.FAIL{color:var(--fail)}
.gate .st.QUEUED{color:var(--muted)} .gate .st.WARN{color:var(--warn)}
.gate .nm{font-family:var(--mono); font-size:11.5px; font-weight:500}
.gate .dt{font-size:11.5px; color:var(--muted); overflow-wrap:anywhere}
.gate .fx{font-size:11.5px; color:var(--fail); margin-top:3px}
.meter{height:4px; border-radius:2px; background:var(--surface-3); overflow:hidden; margin-top:6px}
.meter i{display:block; height:100%; background:var(--pass)}
.meter i.warn{background:var(--warn)} .meter i.bad{background:var(--fail)}

/* beats + strings */
.split{display:grid; grid-template-columns:200px minmax(0,1fr); gap:14px}
@media (max-width:760px){ .split{grid-template-columns:minmax(0,1fr)} }
.picker{border:1px solid var(--rule); border-radius:5px; overflow:hidden; max-height:420px; overflow-y:auto}
.pick{
  display:block; width:100%; text-align:left; background:transparent; border:0;
  border-bottom:1px solid var(--rule); padding:7px 10px; cursor:pointer; font-size:12px;
}
.pick:hover{background:var(--surface-2)}
.pick[aria-current="true"]{background:var(--accent-soft)}
.pick b{font-family:var(--mono); font-size:11.5px; font-weight:600; display:block}
.pick span{color:var(--muted); font-size:11px; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.fieldrow{display:flex; flex-wrap:wrap; gap:10px 14px; align-items:end; margin-bottom:12px}
.field{display:flex; flex-direction:column; gap:3px}
.field label{font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
.editor{margin-bottom:14px}
.editor .lbl{display:flex; align-items:baseline; gap:8px; margin-bottom:5px}
.editor .lbl h4{font-family:var(--mono); font-size:11.5px; font-weight:600; margin:0}
.count{font-family:var(--mono); font-size:11px; color:var(--muted); margin-left:auto}
.count.bad{color:var(--fail); font-weight:600}
.slist{display:flex; flex-direction:column; gap:6px; max-height:560px; overflow-y:auto; padding-right:4px}
.sitem{border:1px solid var(--rule); border-radius:5px; background:var(--surface-2)}
.sitem summary{padding:7px 10px; cursor:pointer; display:flex; flex-wrap:wrap; align-items:baseline; gap:8px; list-style:none}
.sitem summary::-webkit-details-marker{display:none}
.sitem summary b{font-family:var(--mono); font-size:12px; font-weight:600}
.sitem summary .d{font-size:11.5px; color:var(--muted); flex:1 1 180px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sitem pre{
  margin:0; padding:10px; border-top:1px solid var(--rule); background:var(--surface);
  font-family:var(--mono); font-size:11.5px; line-height:1.65; white-space:pre-wrap; overflow-wrap:anywhere;
}
.sitem .acts{display:flex; gap:6px; padding:8px 10px; border-top:1px solid var(--rule)}
.empty{color:var(--muted); font-size:12.5px; padding:20px 0; text-align:center}
.foot{padding:18px 16px 28px; color:var(--muted); font-size:11.5px; text-align:center}
.foot a{color:var(--accent)}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>

<header>
  <div class="brand">
    <h1>Beat Console</h1>

    </p>
  </main>

  <aside class="gates" id="gates" aria-live="polite">
    <h2>Gates</h2>

    <div id="gateList"></div>
  </aside>
</div>

d":323,"declaredHi":323,"note":"","actual":323,"countOk":true,"isPattern":false,"slots":[],"body":"One movement, small in amplitude, completing comfortably inside the clip: nothing travels far across frame, nothing turns more than a little, nothing is rushed to finish. The subject stays fully inside frame the whole time. Nothing leaves frame and comes back, and nothing passes fully behind another object and re-emerges."},{"id":"ANAT-A","section":"App.A","description":"full stack. (589)","declared":589,"declaredHi":589,"note":"","actual":589,"countOk":true,"isPattern":true,"slots":["STACK","BONES"],"body":"Inside the model, the full muscle groups — [STACK] — in natural anatomical colour: warm red, deep rose and muted brick, believable healthy tone with gentle variation between the bellies. Muscle stays semi-transparent and layered so deeper structures remain visible through it, soft inner glow at the thinner edges. Each belly carries broad directional grain running along its own axis — enough to read as muscle, never fine striation and never individual fibres. [BONES] sit deepest, warm ivory-gold with soft low inner luminosity and fine surface grain, gently visible through the muscle."},{"id":"ANAT-ARC-S","section":"App.A","description":"the whole-arc beat, sensation substituted. Replaces ANAT-ARC. Runs at 3s. (1043)","declared":1043,"declaredHi":1043,"note":"","actual":1043,"countOk":true,"isPattern":true,"slots":["TARGET","SITE"],"body":"One continuous arc from pain to relief, already running at full on the very first frame — no build-up, no ignition, no delay. FIRST, THE SENSATION RUNS: [PAIN BEHAVIOUR — the build's ANAT-SENSE block, stated in full, at maximum intensity] filling the first third of the clip, [TARGET] at [SITE] the brightest thing in frame and the whole region carrying it. THEN THE SHELL TAKES IT: the product's cool tone brightens as a load is taken and the sensation begins to go — [RELIEF BEHAVIOUR — the paired ANAT-REL block, stated in full] — the T"],"body":"Premium 3D anatomical visualisation for medical education, broadcast-quality CGI render, cinematic and clean. Vertical composition. A stylised anatomical model of a single [REGION] viewed from a low three-quarter angle, foreshortened, [TARGET JOINT] sitting slightly off-centre and dominating the frame, the limb falling away out of frame at both ends. Deep near-black background with a faint cool blue tint. The outer body contour is a very faint translucent glass-like shell, barely visible, so the silhouette reads clearly as human. Rich, premium, cinematic."},{"id":"ANAT-C","section":"App.A","description":"silhouette. (210)","declared":210,"declaredHi":210,"note":"","actual":210,"countOk":true,"isPattern":true,"slots":["REGION","TARGET"],"body":"The [REGION] reads as a near-solid dark translucent form against the black field, with only [TARGET] and its insertion legible inside it. Everything else falls away into shadow. Maximum reduction, instant read."},{"id":"ANAT-D","section":"App.A","description":"physical model. Mode 1 register break. Takes CAP-A and RIG-R1. (208)","declared":208,"declaredHi":208,"note":"","actual":208,"countOk":true,"isPattern":true,"slots":["TARGET","SITE"],"body":"A plastic anatomical model on a worn wooden worktop in warm domestic light. Hands turn it, thumb pressing [TARGET] at [SITE]. Documentation register: hastily framed, off-centre, uncorrected, brief focus hunt."},{"id":"ANAT-FIELD","section":"App.A","description":"mandatory on every A–C beat. The near-black equivalent of §15A. (195)","declared":195,"declaredHi":195,"note":"","actual":195,"countOk":true,"isPattern":false,"slots":[],"body":"The near-black field carries very faint drifting particulate at depth, slow and directionless, and a subtle tonal gradient that shifts across frame as the camera orbits. Never a flat empty black."},{"id":"ANAT-HOLD-2","section":"App.A","description":"the held sensation. Supersedes ANAT-HOLD. (413)","declared":413,"declaredHi":413,"note":"","actual":413,"countOk":true,"isPattern":true,"slots":["TARGET"],"body":"Where the product sits, the sensation of being held: the flexible component's even compression reads as a continuous soft cool tone hugging the limb at the contact line, steady and unwavering — a state, not an event — the rigid element settled firm against the tissue and brightening a fraction each time a load arrives and it takes it, settling again between. Below the product line [TARGET] sits quiet and pale."},{"id":"ANAT-HOT","section":"App.A","description":"hot start frame. The T2I state for every modulation beat (§12A). Substitute the modulation's own colour and structure. (522)","declared":522,"declaredHi":522,"note":"","actual":522,"countOk":true,"isPattern":true,"slots":["REGION","TARGET","SITE","BONES","STACK"],"body":"STATE — ALREADY UNDER LOAD AND ALREADY ACTIVE. [REGION] is already compressed under load and [TARGET] is already drawn taut at [SITE]. The emission is already established at [SITE], near-white at its core, mid-intensity and clearly glowing — not at peak, leaving headroom to escalate. Warmth has already spread a short way along [TARGET] and is blooming into the surrounding translucent layers. Unmistakably the brightest element in frame. [BONES] and [STACK] stay calm by comparison, uncoloured beyond a faint warm spill."},{"id":"ANAT-LAT","section":"App.A","description":"the lateral shared world. The full base+light+field+silhouette block for lateral force beats, slotted; production-proven this cycle across five beats. Prepend to every lateral anatomy T2I in place of assembling ANAT-BASE+ANAT-LIGHT+ANAT-FIELD+ANAT-SIL by hand. (987 before substitution)","declared":987,"declaredHi":987,"note":"before substitution","actual":987,"countOk":true,"isPattern":true,"slots":["REGION","TARGET JOINT","STACK","BONES","TARGET"],"body":"Premium 3D anatomical visualisation for medical education, broadcast-quality CGI render, cinematic and clean. Vertical composition. A stylised anatomical model of a single [REGION] in true lateral profile, [TARGET JOINT] flexed mid-stride, framed wide from proximal to distal bound, the limb running tall through frame against a deep near-black field with a faint cool blue tint and very faint drifting particulate at depth. Full muscle stack in natural anatomical colour — [STACK], warm red and muted brick, semi-transparent and layered, broad directional grain along each belly, never individual fibres. [BONES] deepest, warm ivory-gold with soft inner luminosity. The outer body contour a faint translucent glass-like shell, and a bright cool blue-white rim light tracing the entire silhouette, crisp against the black. Three-source render lighting with strong falloff, shallow depth of field, volumetric scatter through the translucent tissue, clean satin sheen on [TARGET] and bone."},{"id":"ANAT-LIGHT","section":"App.A","description":"mandatory on every A–C beat, alongside ANAT-BASE. The block that fixes \"plain.\" (809)","declared":809,"declaredHi":809,"note":"","actual":809,"countOk":true,"isPattern":true,"slots":["TARGET"],"body":"Three-source render lighting, never flat ambient: a cool pale-cyan key raking across the form from upper camera-left to reveal contour and thickness, a low warm amber bounce from beneath picking out the underside of the bone so the ivory reads warm against the cool key, and a bright cool rim tracing the translucent silhouette away from the field. The limb is fully and evenly lit along its whole visible length, proximal bound to distal bound, every structure clearly readable end to end — the darkness in frame belongs to the field behind the limb, never to the limb itself, and never to the frame edges. Shallow depth of field, [TARGET] crisp. Light scatters volumetrically through the translucent tissue, brightest where the form is thinnest. Clean satin specular sheen on [TARGET] and the bone surfaces."},{"id":"ANAT-LOAD","section":"App.A","description":"mandatory on every modulation beat. (242)","declared":242,"declaredHi":242,"note":"","actual":242,"countOk":true,"isPattern":true,"slots":["STACK","TARGET"],"body":"[STACK] shortens and thickens as the load arrives, [TARGET] visibly tightens and straightens along its length, and the whole structure compresses a few degrees. The anatomy takes the weight — it is not a still model with light played over it."},{"id":"ANAT-MOD3","section":"App.A","description":"impact. One arrival, never a rhythm. (387)","declared":387,"declaredHi":387,"note":"","actual":387,"countOk":true,"isPattern":true,"slots":["STACK","TARGET","SITE"],"body":"A single hard arrival, not a build and not a rhythm. [STACK] compresses and [TARGET] draws taut as the load arrives — one sharp event, once. At the instant of arrival a near-white flash ignites at [SITE] and the whole structure compresses fractionally against it. The flash decays back to a hot glowing core within the clip but never goes out and never settles. Still glowing at the cut."},{"id":"ANAT-MOD4","section":"App.A","description":"degrade. Wear and damage lines. (385)","declared":385,"declaredHi":385,"note":"","actual":385,"countOk":true,"isPattern":true,"slots":["SITE","TARGET"],"body":"At [SITE], the surface of [TARGET] is visibly roughening — fine texture lifting and coarsening a little at a time, accumulating steadily across the clip. Never a break, never a rupture. The disrupted zone spreads slowly outward from [SITE], dull orange and grainy where the surface has coarsened. Each change is smaller than a hair. Still roughening on the final frame, never stopping."},{"id":"ANAT-MOD5-S","section":"App.A","description":"futile. Replaces ANAT-MOD5. (741)","declared":741,"declaredHi":741,"note":"","actual":741,"countOk":true,"isPattern":true,"slots":["TARGET","SITE"],"body":"A generic unbranded intervention is already in place over the region — plain, soft, no wordmark, no hardware — and a cool pale wash spreads from it across the outer body contour. The wash stays entirely on the surface: it never penetrates inward to [TARGET], never reaches [SITE], and dies out at the boundary of the translucent shell. Beneath it the sensation at [SITE] carries on completely unchanged — same rate, same brightness, same behaviour it had before anything was applied, visibly indifferent to the intervention. It does not ease, it does not worsen, it does not react in any way. The pale surface wash weakens and fades out first, leaving nothing behind and changing nothing. Still running at the cut exactly as it ran at entry."},{"id":"ANAT-MOD5-SC","section":"App.A","description":"futile, compressed. The 3s default. (494)","declared":494,"declaredHi":494,"note":"","actual":494,"countOk":true,"isPattern":true,"slots":["TARGET","SITE"],"body":"A generic unbranded intervention is already in place over the region — plain, soft, no wordmark, no hardware — and a cool pale wash spreads across the outer body contour only, never penetrating inward to [TARGET] and never reaching [SITE]. Beneath it the sensation at [SITE] carries on completely unchanged in rate, brightness and behaviour, visibly indifferent — not easing, not worsening, not reacting. The wash fades out first, changing nothing. Still running at the cut exactly as at entry."},{"id":"ANAT-MOD6-S","section":"App.A","description":"protection. Replaces ANAT-MOD6 and ANAT-MOD6C. Substitute [BAND-MATERIAL] and [LOAD-CADENCE] from the Product Sheet. (874)","declared":874,"declaredHi":874,"note":"","actual":874,"countOk":true,"isPattern":true,"slots":["LOAD-CADENCE","TARGET JOINT","STACK","BAND-MATERIAL","TARGET","SITE"],"body":"Already cycling on the very first frame, product seated and working, [LOAD-CADENCE], one arrival per second. On each arrival [TARGET JOINT] flexes, [STACK] shortens and releases, and the rigid element meets the load first — settling a fraction deeper into the tissue and holding that indentation while the load is present, the [BAND-MATERIAL] band visibly stretching open along the line of force and easing back between. Beneath it [TARGET] barely moves and does not light: the sensation that fired at [SITE] on every load simply does not arrive, arrival after arrival, and [SITE] stays cool and pale for the whole clip. The product's own cool tone brightens a fraction as each load is taken and settles between. The product holds station under every arrival — never sliding, never rotating, never riding up. Still cycling at the cut, load still landing, [SITE] still quiet."},{"id":"ANAT-MOD7","section":"App.A","description":"recovery. Healing and timeframe lines. (329)","declared":329,"declaredHi":329,"note":"","actual":329,"countOk":true,"isPattern":true,"slots":["TARGET","SITE"],"body":"The inflamed mass inside [TARGET] is already receding on frame one, its boundary contracting steadily inward toward [SITE]. Pale healthy tissue re-forms behind the retreating boundary, cool and even. The throb slows and softens with every cycle as the mass shrinks. Still contracting on the final frame, reduced but not yet gone."},{"id":"ANAT-NEG","section":"App.A","description":"every anatomical mechanism beat. Drop the arrow/line clause only on beats running a modulation. (1,082)","declared":1082,"declaredHi":1082,"note":"","actual":1082,"countOk":true,"isPattern":false,"slots":[],"body":"no crossfade, no glow fading in place, no gradual onset, no delay before the modulation starts, no build-up, no ignition, no steady unchanging glow, no emission settling or resolving, no static anatomy, no anatomy holding still, no flat ambient lighting, no evenly lit form, no low contrast, no centred symmetrical composition, no arrows, no force arrows, no motion lines, no vector lines, no leader lines, no diagram markings, no highlighted hotspots, no text overlays, no labels, no numbers, no annotations, no callouts, no UI, no watermark, no measurement instruments, no opaque surfaces, no individual muscle fibres, no surface veins, no emission on the bone shafts, no rigid brace, no hinges, no sleeve, no second unit, no product half-on, no symmetrical or distorted product geometry, no misplaced wordmark, no second limb, no clothing, no hands, no people, no x-ray look, no flat illustration, no cel-shading, no cartoon look, no vignette, no darkened frame corners, no spotlight pool, no limb falling off into darkness, no structures lost in shadow at either end of the limb"},{"id":"ANAT-PHYS","section":"App.A","description":"mechanical behaviour, §12B. In motion after the modulation. Every A–C modulation beat. (979 before substitution)","declared":979,"declaredHi":979,"note":"before substitution","actual":979,"countOk":true,"isPattern":true,"slots":["STACK","TARGET","TARGET JOINT"],"body":"The structures behave mechanically, not decoratively — the event is physical and the light only reports it. Through the load cycle the muscle bellies of [STACK] visibly shorten and thicken along their own axis as they contract and lengthen again as they release; [TARGET] draws taut and its slack disappears as tension arrives, its surface tightening and its cord-like form straightening between its attachments, then softening as the load passes; [TARGET JOINT] changes angle through the cycle exactly as it would in a stride, the bones tracking each other with correct joint spacing and never interpenetrating; where the product sits, the band is visibly stretched under tension with the knit under strain, and the shell presses into the structure beneath it, indenting it and holding that indentation while the load is present. Every deformation is small, controlled and anatomically correct — structures behaving like tensioned tissue and hinged bone, never like soft rubber."},{"id":"ANAT-PHYS-C","section":"App.A","description":"compressed. The default at 3s. (516 before substitution)","declared":516,"declaredHi":516,"note":"before substitution","actual":516,"countOk":true,"isPattern":true,"slots":["STACK","TARGET","TARGET JOINT"],"body":"Mechanical behaviour, not decoration: [STACK] bellies shorten and thicken as they contract and lengthen as they release; [TARGET] draws taut, its slack disappearing and its surface tightening as tension arrives, softening as it passes; [TARGET JOINT] changes angle through the cycle with correct joint spacing, bones never interpenetrating; the band visibly stretches under tension and the shell indents the structure beneath and holds it. Deformations small, controlled and anatomically correct — never soft rubber."},{"id":"ANAT-PROD","section":"App.A","description":"append wherever the product appears. Reference image attached to the call; prose carries REF-PROD plus placement, never a fresh rebuild. (414)","declared":414,"declaredHi":414,"note":"","actual":414,"countOk":true,"isPattern":false,"slots":[],"body":"Already fully and correctly in place per the Product Sheet placement spec. Materials solid and opaque against the translucent anatomy, hardware catching bright hard specular flares, wordmark readable. The flexible component visibly tensions and the rigid element presses into the structure beneath it, deforming it slightly — the product is doing work, not resting on top. Never being fitted, threaded or adjusted."},{"id":"ANAT-REL-B","section":"App.A","description":"(424)","declared":424,"declaredHi":424,"note":"","actual":424,"countOk":true,"isPattern":true,"slots":["TARGET"],"body":"The same heat, draining under the product. A cool boundary travels along [TARGET] from the product outward and the burn visibly empties behind it, the orange receding ahead of the edge and leaving the structure pale and calm where it has passed — never a crossfade, never a fade in place, always a moving edge with heat on one side of it and none on the other. Still travelling at the cut, a band of warmth left ahead of it."},{"id":"ANAT-REL-D","section":"App.A","description":"(360)","declared":360,"declaredHi":360,"note":"","actual":360,"countOk":true,"isPattern":true,"slots":["SITE"],"body":"The same ache, flattening under the product. Each swell rises lower than the one before and the diffuse mass contracts inward toward [SITE], its boundary drawing in and its colour lifting toward pale as the structure lightens from the outside edges first. The rhythm slows as it shrinks. Still contracting at the cut, reduced and still going, never fully gone."},{"id":"ANAT-REL-E","section":"App.A","description":"(344)","declared":344,"declaredHi":344,"note":"","actual":344,"countOk":true,"isPattern":true,"slots":["TARGET"],"body":"The same forks, dying under the product. They thin, slow and arrive further apart, each one travelling a shorter distance along [TARGET] than the one before, the last few flickering weakly and going out along the structure while the cool tone of the product holds steady over them. Still flickering faintly at the cut, never fully extinguished."},{"id":"ANAT-REL-S","section":"App.A","description":"the strongest beat in the library. Substitute [LOAD-CADENCE]. (422)","declared":422,"declaredHi":422,"note":"","actual":422,"countOk":true,"isPattern":true,"slots":["LOAD-CADENCE","TARGET"],"body":"The load still arrives, and the spike does not. At the same [LOAD-CADENCE] the rigid element takes each arrival and [TARGET] stays quiet under it — the hard white spike that fired on every load simply does not happen, cycle after cycle, the absence unmistakable against the first beats. Underneath, the base ache dims steadily and the tightening softens. Still cycling at the cut, load still landing, [TARGET] still quiet."},{"id":"ANAT-REL-T","section":"App.A","description":"(367)","declared":367,"declaredHi":367,"note":"","actual":367,"countOk":true,"isPattern":true,"slots":["TARGET"],"body":"The same throb, dying under the product. Each beat arrives softer than the last and further apart, the bright centre dulling and the trough lifting so the swing collapses toward nothing, [TARGET] tightening less on every beat. Never a cut-off, never a fade, never silence — the beats are still coming at the cut, faint and slow and far apart, the last one unfinished."},{"id":"ANAT-REST","section":"App.A","description":"resting state. Start frame only for a beat whose action is the onset itself (§12A). (158)","declared":158,"declaredHi":158,"note":"","actual":158,"countOk":true,"isPattern":false,"slots":[],"body":"Calm resting state, nothing happening. Bone luminosity quiet and even — ambient warmth only, not a bright emission, no hotspot, no concentrated glow anywhere."},{"id":"ANAT-SENSE-B","section":"App.A","description":"burning, on fire. (570)","declared":570,"declaredHi":570,"note":"","actual":570,"countOk":true,"isPattern":true,"slots":["TARGET","SITE"],"body":"Already burning on the very first frame — no ignition, no build-up, no onset. A deep sustained heat fills [TARGET] at [SITE] and holds there with no rhythm anywhere in it: a steady saturated orange that never dims, never flickers, never drops back between anything, intensifying slowly and continuously across the clip while the soft tissue immediately around it warms to the same colour from within. The heat creeps a little further along [TARGET] as it intensifies and never leaves it. Still burning and still intensifying at the cut, brighter and wider than at entry."},{"id":"ANAT-SENSE-D","section":"App.A","description":"aching, stiff, heavy, dull. (516)","declared":516,"declaredHi":516,"note":"","actual":516,"countOk":true,"isPattern":true,"slots":["TARGET","SITE"],"body":"Already aching on the very first frame. A wide diffuse warmth sits inside [TARGET] and the soft tissue around [SITE] — not a point, not an edge, a heavy low-saturation mass with no clear boundary to it. It swells slowly, a long rise of roughly two seconds and an equally long fall, never fully dark between swells and never reaching a sharp peak. No attack anywhere in it, nothing snapping, nothing percussive. The mass sits a little heavier and a little wider with each swell. Still swelling at the cut, unresolved."},{"id":"ANAT-SENSE-E","section":"App.A","description":"electric/shooting pain (§12A sensation library). Pairs with ANAT-LOAD and NEG-EXTERNAL; add no steady glow, no rhythmic pulsing, no single flash to the negatives to keep it distinct from the throb. (559)","declared":559,"declaredHi":559,"note":"","actual":559,"countOk":true,"isPattern":true,"slots":["TARGET","SITE","STACK"],"body":"Already active on the very first frame — no build-up, no delay. Thin bright white-orange forks of energy flicker rapidly ALONG the length of [TARGET] from [SITE], like current running a frayed wire — fast, irregular, branching, each fork travelling the structure's own surface and gone within a fraction of a second, another arriving immediately somewhere else along it, never a steady glow and never a rhythm. [TARGET] tightens sharply with each fork, [STACK] flinching in sympathy. The flickering never pauses, never settles, and is still firing at the cut."},{"id":"ANAT-SENSE-S","section":"App.A","description":"sharp, catching, a knife when I step. (562)","declared":562,"declaredHi":562,"note":"","actual":562,"countOk":true,"isPattern":true,"slots":["TARGET","SITE"],"body":"Two things at once, both already running on frame one. Underneath, a low dull orange ache sits inside [TARGET] at [SITE] and never stops, breathing slowly and quietly the whole clip. On top of it, at walking cadence — one per second, as each load arrives — a hard bright spike fires at [SITE], snapping instantly to a white core and gone within a fraction of a second, [TARGET] tightening sharply as it lands. Between spikes the base ache carries on unchanged and never goes dark. The spikes grow brighter across the clip. Still firing at the cut, cut mid-spike."},{"id":"ANAT-SENSE-T","section":"App.A","description":"throbbing, pounding, pulsing. (659)","declared":659,"declaredHi":659,"note":"","actual":659,"countOk":true,"isPattern":true,"slots":["TARGET","SITE"],"body":"Already throbbing on the very first frame — no build-up, no ignition, nothing switching on. Inside [TARGET] at [SITE] a warm orange core pulses at footstep rate, one beat per second, and never stops. Each beat snaps fast to a bright near-white centre and decays away, dropping back between beats to a deep saturated orange so the swing from trough to peak is large and obvious. [TARGET] tightens sharply on every beat and softens between. The emission never migrates from [SITE] and never spreads far from it. Amplitude climbs across the clip — the last beats are wider and brighter than the first. Still throbbing and still climbing at the cut, cut mid-beat."},{"id":"ANAT-SIL","section":"App.A","description":"silhouette rim. Mandatory on lateral-orientation beats. (302)","declared":302,"declaredHi":302,"note":"","actual":302,"countOk":true,"isPattern":false,"slots":[],"body":"A bright cool blue-white rim light traces the entire outer contour of the limb from proximal to distal bound, crisp and luminous, clearly outlining it against the black field. The outer body contour is a translucent glass-like shell, faintly visible, so the limb reads unmistakably as human beneath it."},{"id":"ANAT-STRESS-P","section":"App.A","description":"problem, full. Substitute [LOAD-CADENCE]. (1,095)","declared":1095,"declaredHi":1095,"note":"","actual":1095,"countOk":true,"isPattern":true,"slots":["TARGET","LOAD-CADENCE","TARGET JOINT","STACK","BONES","SITE"],"body":"Already mid-cycle on the very first frame — the joint already loaded, [TARGET] already partially compressed, no build-up, no delay. The load repeats at [LOAD-CADENCE], one compression cycle per second: [TARGET JOINT] flexes a few degrees as each arrival lands, the bellies of [STACK] shortening and thickening on the loading phase and lengthening on release, and [BONES] drive down from above onto [TARGET] at [SITE]. On every arrival [TARGET] visibly compresses and flattens under the bone, bulging slightly at its edges, then recovers as the load passes — the shape change is the event. The warm ember inside the compressed zone brightens only at the moment of compression and dims between cycles, heat held inside the tissue where the force passes, never changing position. Recovery is incomplete: with each cycle [TARGET] springs back a fraction less, resting slightly flatter and slightly warmer than the cycle before, its resting state visibly degrading across the clip, the final cycles showing a structure that no longer fully recovers. Still cycling on the final frame, cut mid-arrival."},{"id":"ANAT-STRESS-PC","section":"App.A","description":"problem, compressed, the 3s default. (601)","declared":601,"declaredHi":601,"note":"","actual":601,"countOk":true,"isPattern":true,"slots":["TARGET","LOAD-CADENCE","TARGET JOINT","STACK","BONES","SITE"],"body":"Already mid-cycle on frame one, [TARGET] already partially compressed. Load repeats at [LOAD-CADENCE], one compression cycle per second: [TARGET JOINT] flexes on each arrival, [STACK] shortens and lengthens, [BONES] drive down onto [TARGET] at [SITE]. Each arrival visibly compresses and flattens [TARGET], edges bulging, then partial recovery — the ember inside the compressed zone brightens only on compression and dims between, never changing position. Recovery is incomplete: each cycle springs back a fraction less, resting flatter and warmer than the last. Still cycling at the cut, mid-arrival."},{"id":"ANAT-STRESS-R","section":"App.A","description":"the reveal transition, mechanical amplitude halving. Needs 5s+, never a 2–3s cutaway; the halving cycle is the cover point. (826)","declared":826,"declaredHi":826,"note":"","actual":826,"countOk":true,"isPattern":true,"slots":["LOAD-CADENCE","TARGET","BONES","BAND-MATERIAL"],"body":"One continuous take at [LOAD-CADENCE], one compression cycle per second, already running at full amplitude on frame one — [TARGET] flattening completely under [BONES] on every arrival, ember brightening on each compression. The instant the product acts, the very next arrival lands at visibly half the compression: one cycle, unmistakable — [TARGET] pressing shallow where it flattened a moment before, the rigid element taking the difference, the [BAND-MATERIAL] band stretching open as it does. The reduced amplitude then holds on every following cycle, [TARGET] recovering fully between arrivals for the first time in the clip, the ember dimming as the deflection stays small. Never a fade, never a crossfade — the change is mechanical and lands on a single arrival. Still cycling at the cut, amplitude reduced and holding."},{"id":"ANAT-STRESS-S","section":"App.A","description":"protection, full. (1,151)","declared":1151,"declaredHi":1151,"note":"","actual":1151,"countOk":true,"isPattern":true,"slots":["LOAD-CADENCE","TARGET JOINT","STACK","BONES","BAND-MATERIAL","TARGET","SITE"],"body":"Already mid-cycle on the very first frame — same [LOAD-CADENCE], one compression cycle per second, the product already seated and already working. Each arrival lands exactly as before: [TARGET JOINT] flexes, [STACK] loads and releases, [BONES] drive down from above — but the rigid element meets the load first, settling a fraction deeper into the tissue on every arrival and holding that indentation while the load is present, the [BAND-MATERIAL] band visibly stretching open along the line of force on each arrival and easing back between. Beneath it [TARGET] barely moves: its deflection is visibly smaller — a shallow press where an unprotected structure flattens — and it recovers fully between every cycle, resting shape restored each time. The ember at [SITE] stays dim throughout; the cool tone on the rigid element and band edges brightens a fraction at each absorbed arrival and settles between. The product holds station under every arrival — never sliding, never rotating, never riding up: holding position under load is the demonstration. Still cycling at the cut, load still arriving, rigid element still taking it, [TARGET] still quiet."},{"id":"ANAT-STRESS-SC","section":"App.A","description":"protection, compressed, the 3s default. (653)","declared":653,"declaredHi":653,"note":"","actual":653,"countOk":true,"isPattern":true,"slots":["LOAD-CADENCE","TARGET JOINT","BONES","BAND-MATERIAL","TARGET","SITE"],"body":"Already mid-cycle on frame one, product seated and working, same [LOAD-CADENCE], one compression per second. Each arrival: [TARGET JOINT] flexes, [BONES] drive down — the rigid element meets the load first, indenting the tissue and holding it, the [BAND-MATERIAL] band stretching open on each arrival and easing between. [TARGET] barely moves — a shallow press where an unprotected structure flattens — and recovers fully every cycle. The ember at [SITE] stays dim; the cool tone on rigid element and band edges brightens a fraction at each absorbed arrival. The product never slides, rotates or rides up. Still cycling at the cut, [TARGET] still quiet."},{"id":"AUD-A","section":"App.A","description":"audio capture core. Never edited, never trimmed. (378)","declared":378,"declaredHi":378,"note":"","actual":378,"countOk":true,"isPattern":false,"slots":[],"body":"Audio must sound like a phone microphone recording in a room, not a studio voice track: audible breath before the first word and between phrases, mouth and lip noise, sibilance present and un-de-essed, plosives on hard consonants, level drifting slightly across the take rather than sitting compressed and even. No studio compression, no noise gate, no reverb plate, no post EQ."},{"id":"AUD-PATTERN","section":"App.A","description":"Part B format model. Two clauses: room size and surface hardness, then where the voice sits. (160)","declared":160,"declaredHi":160,"note":"","actual":160,"countOk":true,"isPattern":false,"slots":[],"body":"[Room size and surface character], [reflection character and tail length], voice [distance from mic] with [amount] of room in the signal, [bass proximity note]."},{"id":"AVATAR-SHEET","section":"App.A","description":"the sheet pattern. CAM-LOCK precedes it; the §22T skin paragraph at test strength, CAP-SHARP and CAP-FILE follow it; NEG-SHEET plus NEG-FILE plus NEG-DEFAULT-FACE close it. Fill every bracket in plain language. (1,913 as template)","declared":1913,"declaredHi":1913,"note":"as template","actual":1913,"countOk":true,"isPattern":true,"slots":["WOMAN/MAN","SIDE","WALL COLOUR","FLOOR"],"body":"A character reference sheet: FIVE PHOTOGRAPHS OF THE SAME ONE [WOMAN/MAN], tiled edge to edge on a single tall 9:16 canvas with thin seams between them, all taken within the same minute in the same spare room by somebody standing where the door is. TOP ROW, three equal panels: full length head to toe, standing square at the same distance in all three so the head is the same size in each — left panel facing the phone, middle panel in true left profile, right panel in true right profile. BOTTOM ROW, two panels: left, the back of the head and shoulders from the waist up; right, a tight face close-up from the hairline to the collarbones, facing the phone, eyes level on the lens — the same face as the front panel, closer. Every panel is this person and only this person, and nothing changes between panels except the angle of the body. [FACE — architecture in three or four plain sentences, the one marker, the asymmetries]. [HAIR — colour, roots, how worn, the same tone and the same height in every panel]. [BODY — build, height impression]. Bare face, no makeup, in every panel including the close-up. Mouth closed, no expression held for the camera. [WARDROBE — BASE, LOWER, FOOT], identical in every panel; exposed skin bare and plain, nothing on the skin in one panel that is not in all the others. THE LIGHT is one window, to the [SIDE], in every panel: daylight from that side at about forty-five degrees, bright on the near side of the face and body and falling off across the far cheek to open shadow lifted by bounce off the wall — the same side, the same fall-off, in all five panels, so the profiles are lit one from the front and one from behind exactly as they would be. The window out of frame, its edge blowing a patch of the wall to flat white in the [SIDE]-hand panels, the room a little under-exposed away from it. Plain [WALL COLOUR] wall, white skirting, [FLOOR], nothing else in frame."},{"id":"BREAK-CERAMIC","section":"App.A","description":"ceramic, porcelain, stoneware. (587)","declared":587,"declaredHi":587,"note":"","actual":572,"countOk":false,"isPattern":true,"slots":["NAMED PART"],"body":"It does not bend, squash or bounce at all before it goes. At the instant the [NAMED PART] meets the surface, cracks run outward from that one point across the body, and immediately after — not at the same moment — it comes apart into four or five large angular pieces with straight sharp edges, along with a scatter of small chips and a little fine dust. The pieces are flat-sided and hard-edged, clearly parts of the thing it was. The handle stays in one piece. The pieces slide outward across the floor, slowing with friction, one of them still turning as the clip ends."},{"id":"BREAK-GLASS","section":"App.A","description":"thin glass. (520)","declared":520,"declaredHi":520,"note":"","actual":458,"countOk":false,"isPattern":false,"slots":[],"body":"It does not deform at all before it goes. At the instant of contact it comes apart into many small bright shards and a fine spray of fragments, far more pieces than a ceramic object gives and travelling much further across the floor, skidding and tumbling outward well past where it landed. The largest pieces are still only a few centimetres across. Light catches the edges as they move. Several are still sliding and one is still spinning as the clip ends."},{"id":"BREAK-PLASTIC","section":"App.A","description":"hard plastic. Does not shatter. (398)","declared":398,"declaredHi":398,"note":"","actual":341,"countOk":false,"isPattern":false,"slots":[],"body":"It does not shatter. On contact it flexes, bounces once with a short flat hop, and skitters away across the floor still in one piece, turning as it goes. It may split along a single line without separating. Whatever it does, it keeps its overall shape and springs most of the way back to it. It is still sliding and turning as the clip ends."},{"id":"BREAK-SOFT","section":"App.A","description":"soft food, fruit, anything that pulps. (377)","declared":377,"declaredHi":377,"note":"","actual":326,"countOk":false,"isPattern":false,"slots":[],"body":"It does not scatter. On contact it splits and pulps at the point of impact, spreading sideways and staying low, releasing its own liquid as it goes, and it sticks where it lands rather than sliding away. Nothing travels far. The split is still opening and the liquid is still spreading out from underneath it as the clip ends."},{"id":"BREATH-A","section":"App.A","description":"replaces §28B's entry-breath line in every talking-head motion. (178)","declared":178,"declaredHi":178,"note":"","actual":176,"countOk":false,"isPattern":false,"slots":[],"body":"Take one small quick inhale and begin speaking as it finishes — the first word lands within the first half second of the clip, no settle, no glance, no held beat before speech."},{"id":"BROLL-REAL","section":"App.A","description":"the alibi register. Under §22T its content is folded into SEED-CANDID prose on lifestyle seeds; pasted verbatim only where a seed is not §22T-governed. (456)","declared":456,"declaredHi":456,"note":"","actual":456,"countOk":true,"isPattern":false,"slots":[],"body":"The shot is candid footage, not a composed shot: subject framed off-centre with imperfect headroom, the action already underway when the clip begins and still unresolved at the end, brief foreground occlusion from the room itself, focus settling a beat late as movement starts, everyday clutter left in place on every surface. Framing looks chosen by where the phone could sit, not by a photographer. Nothing is styled, staged, or performed for the camera."},{"id":"CAM-CCTV","section":"App.A","description":"opens every CCTV T2I, above everything else. Replaces CAM-LOCK. Never trimmed. (348)","declared":348,"declaredHi":348,"note":"","actual":362,"countOk":false,"isPattern":false,"slots":[],"body":"Still frame from a fixed security camera, recorded rather than filmed. Small sensor behind a wide short lens, everything from a metre away to the back wall equally sharp, visible barrel distortion bending the straight lines near the frame edges, real optical vignetting darkening the corners. Nobody set this camera up for this moment and nobody is operating it."},{"id":"CAM-LOCK","section":"App.A","description":"the §22 camera lock. Opens every Mode 1 T2I, above everything else. Never trimmed. (amended V7.49.6 to the iPhone 17 Pro Max — the newer pipeline is more polished, so its artefacts are named in CAP-SHARP; naming only the camera renders the marketing) (363)","declared":363,"declaredHi":363,"note":"","actual":363,"countOk":true,"isPattern":false,"slots":[],"body":"Shot on an iPhone 17 Pro Max, handheld, the main 48MP Fusion camera at 24mm equivalent and f/1.78, left on its default 24 megapixel output, Smart HDR 5 and Deep Fusion on, Photographic Style on Standard, everything left on automatic — exposure, white balance and focus all chosen by the phone rather than by a person. An ordinary photo taken on an ordinary phone."},{"id":"CAP-A","section":"App.A","description":"Mode 1 capture core. T2I only (§37). Never edited, never trimmed. (two-word amendment V7.49.6: 24mm, Smart HDR 5) (427)","declared":427,"declaredHi":427,"note":"","actual":427,"countOk":true,"isPattern":false,"slots":[],"body":"Capture must look like a phone camera file, not a lit scene: Smart HDR 5 tone-mapping lifting the shadows so they read flat rather than deep, highlight clipping at the brightest edge of frame, natural warm-neutral colour temperature straight out of the phone, subtle lens distortion and softening at the frame edges consistent with a 24mm phone lens. No colour grading, no retouched skin, no shaped or lit light on the subject."},{"id":"CAP-C","section":"App.A","description":"compressed capture, daylight. The production short form of CAP-A where the T2I is dense; CAP-A remains the full form and the never-trim reference. (262) (262)","declared":262,"declaredHi":262,"note":"","actual":262,"countOk":true,"isPattern":false,"slots":[],"body":"Capture is a phone camera file, not a lit scene: Smart HDR lifting the shadows flat, slight compression softness at the frame edges from a 26mm lens, natural colour temperature straight off the phone. No colour grading, no retouched skin, no shaped or lit light."},{"id":"CAP-CCTV","section":"App.A","description":"the file block. Replaces CAP-A, which it contradicts. Never trimmed. (613)","declared":613,"declaredHi":613,"note":"","actual":614,"countOk":false,"isPattern":false,"slots":[],"body":"This is a low-bitrate recording, not a photograph. No HDR and no shadow recovery: the camera exposes for the middle of the frame and lets the brightest window or lamp blow out to flat pure white with nothing left in it, while the far corners fall away to crushed black. Heavy compression throughout — blocky artefacting across flat surfaces like walls and floors, mosquito noise crawling around high-contrast edges, colour smearing and detail collapsing wherever anything is moving. No white balance correction, so the whole frame takes the colour of whatever is lighting the room. Fine detail is simply not there."},{"id":"CAP-FILE","section":"App.A","description":"the under-render block. T2I, directly after CAP-A, every Mode 1 beat. (639)","declared":639,"declaredHi":639,"note":"","actual":639,"countOk":true,"isPattern":false,"slots":[],"body":"THIS IS A FILE, NOT A PICTURE. Nobody framed it, nobody lit it, nobody chose the moment and nobody looked at it afterwards. It is an unremarkable photograph off a phone. Sharpness is uneven across the frame: one plane is in focus and everything in front of and behind it falls away, because the lens has one fixed aperture and nobody chose where to put the focus. Edges are soft rather than crisp, with faint compression mush in the shadows and detail thinning toward the corners. Nothing has been sharpened, cleaned up, separated from its background or arranged, and no part of the frame has been given more attention than any other part."},{"id":"CAP-SHARP","section":"App.A","description":"directly after SKIN-T. Never trimmed. (amended V7.49.6 for the iPhone 17 pipeline) (584)","declared":584,"declaredHi":584,"note":"","actual":584,"countOk":true,"isPattern":false,"slots":[],"body":"THE PHONE'S PROCESSING HAS MADE THE SKIN WORSE, NOT BETTER. The iPhone 17's pipeline has over-sharpened the face the way it does in directional light: every pore, hair and line crunched into crisp micro-contrast with a faint bright halo along the jaw and the hairline where the sharpening overshoots, Smart HDR 5 flattening the big contrast so the lit and shadow sides both hold detail, and the noise reduction smearing the fine texture into a faint watercolour smoothness only in the deepest shadow while the lit skin stays harshly detailed. The skin reads as terrain, not a surface."},{"id":"CCTV-BELL","section":"App.A","description":"doorbell camera. The one CCTV angle with a face near the lens. (392)","declared":392,"declaredHi":392,"note":"","actual":386,"countOk":false,"isPattern":false,"slots":[],"body":"Doorbell camera at about chest height beside the door, looking outward and slightly upward, extreme wide angle with heavy barrel distortion pulling the edges of the frame outward and pushing the face in the centre forward. The visitor is very close and very large, the path behind them falls away fast, and a hand or a parcel can enter frame enormous and out of focus in the foreground."},{"id":"CCTV-CORNER","section":"App.A","description":"the default angle. (398)","declared":398,"declaredHi":398,"note":"","actual":387,"countOk":false,"isPattern":false,"slots":[],"body":"Mounted high in the corner of the room where two walls meet the ceiling, roughly two and a half metres up, angled down across the space at about forty degrees. The ceiling line runs across the top of frame and the floor fills the lower half. Furniture is seen from above and behind, foreshortened, and people read as much by the tops of their heads and their shoulders as by their faces."},{"id":"CCTV-DOOR","section":"App.A","description":"doorway mount. (389)","declared":389,"declaredHi":389,"note":"","actual":375,"countOk":false,"isPattern":false,"slots":[],"body":"Mounted above the door frame looking back down the length of the room, roughly two metres up and angled down about thirty degrees, so the near floor fills the bottom of frame and the far wall sits small at the top. Anyone entering arrives from directly beneath the camera, appearing first as the top of a head very close to the lens before walking away from it and shrinking."},{"id":"CCTV-EAVE","section":"App.A","description":"exterior. (349)","declared":349,"declaredHi":349,"note":"","actual":334,"countOk":false,"isPattern":false,"slots":[],"body":"Mounted outside under the eave of the house, angled down across the path and the drive, roughly three metres up. The near ground fills the bottom of frame, the gate or the street sits small at the top, and the roofline cuts into one upper corner. Anyone approaching grows from small to large as they cross the frame toward the camera."},{"id":"CCTV-FRAME","section":"App.A","description":"composition. Never trimmed — a well-framed CCTV shot is not CCTV. (461)","declared":461,"declaredHi":461,"note":"","actual":433,"countOk":false,"isPattern":false,"slots":[],"body":"The subject is not framed. Nobody composed this: the subject sits off-centre or close to the edge, is partly cut by the frame, or is partly hidden behind furniture, and a large part of the picture is empty floor, wall and ceiling that nobody would have chosen to include. No headroom, no thirds, no leading lines, no arranged foreground and background. The camera is covering a room, not a person, and the person happens to be in it."},{"id":"CCTV-NIGHT","section":"App.A","description":"overlays any angle. (327)","declared":327,"declaredHi":327,"note":"","actual":323,"countOk":false,"isPattern":false,"slots":[],"body":"Night infrared: the whole frame is monochrome, the near subject lit hot and grey-white by the camera's own emitters while everything beyond a few metres falls away to solid black, eyes catching the infrared as bright points, no colour anywhere in the picture, and the compression artefacting heavier than it is in daylight."},{"id":"CCTV-OVER","section":"App.A","description":"overhead. (281)","declared":281,"declaredHi":281,"note":"","actual":286,"countOk":false,"isPattern":false,"slots":[],"body":"Mounted directly overhead looking almost straight down at the surface below, so people read as shoulders and the tops of heads with almost no face visible, and objects read as flat shapes with almost no side to them. The surface fills the frame edge to edge and the walls barely appear."},{"id":"DRAWER-FRAME","section":"App.A","description":"T2I, every beat containing a drawer (§27C travel-limited mechanisms). (845)","declared":845,"declaredHi":845,"note":"","actual":845,"countOk":true,"isPattern":true,"slots":["CABINET FACE","WORKTOP OR TOP","FRACTION"],"body":"DRAWER AND UNIT — the drawer is a real drawer running in a real cabinet, and the cabinet is in frame: the [CABINET FACE] below it and to both sides, the [WORKTOP OR TOP] above it, and the drawer front standing proud of the box behind it and overhanging it top and bottom. The drawer box has four sides and a base, the near side wall standing up above the contents and the base beneath them taking a tight contact shadow from everything resting on it. At both sides the narrow dark slot where the box runs back into the carcass is visible, with the runner and the shadowed cavity of the unit readable behind it. The drawer is out about [FRACTION] of its own length and the rest is still inside the unit, so how far it has travelled is obvious from the frame. It sits level, carried by the runners, its weight hanging off the front of the cabinet."},{"id":"DRAWER-HOME","section":"App.A","description":"I2V motion, closing beats. (395)","declared":395,"declaredHi":395,"note":"","actual":395,"countOk":true,"isPattern":true,"slots":["CABINET FACE"],"body":"COMPLETING — the drawer runs in and STOPS DEAD with its front flush against the [CABINET FACE], one dull knock as it seats, no rebound, no further travel, and the front stays flush and still for the rest of the clip. The hand stays flat on the front and does not push on after it has closed. UNRESOLVED — the loose contents are still rattling and rolling inside the shut drawer as the clip ends."},{"id":"DRAWER-STOP","section":"App.A","description":"I2V motion, opening beats. (584)","declared":584,"declaredHi":584,"note":"","actual":584,"countOk":true,"isPattern":false,"slots":[],"body":"COMPLETING — the drawer runs out the last hand's width and STOPS THERE, the back of the box arriving against its runner stops with one dull knock, out about three quarters of its own length with the last quarter still inside the unit. The drawer body is then completely still and completely level for the rest of the clip. The hand stays on the front through the travel and does not carry on past the stop. UNRESOLVED — everything loose keeps going for a beat after the box has stopped, sliding forward and settling against the front, the lightest item still rocking as the clip ends."},{"id":"EYES-A","section":"App.A","description":"ocular physical spec, Mode 1. T2I only; §28E still owns the gaze arc in I2V. (452)","declared":452,"declaredHi":452,"note":"","actual":452,"countOk":true,"isPattern":false,"slots":[],"body":"EYES — the key source reproduced in each eye as a small hard catchlight, both in the same position relative to the light. A wet meniscus of tear film along each lower lid catching a thin bright line. Sclera faintly bloodshot toward the outer corners, pink at the tear ducts. Lashes uneven, sparse and clumped rather than full, a few out of line. Iris fibrous, pupil edge slightly irregular. Eyelid skin finely creped and darker than the face around it."},{"id":"FACE-SEED","section":"App.A","description":"T2I, every FACE-state B-roll seed; the character's or subject's reference sheet is attached to the same call. Substitute the character's §19A markers. (238 as template)","declared":238,"declaredHi":238,"note":"as template","actual":238,"countOk":true,"isPattern":true,"slots":[],"body":"The face fully visible, clearly resolved and large enough in frame to read every feature — the same face as the attached reference, [the character's named markers] clearly present — never in profile only, never turned away, never distant."},{"id":"GEO-LINE","section":"App.A","description":"one per sequence, in camera.framing, written when the establishing beat is placed on the act map. (210 as template)","declared":210,"declaredHi":210,"note":"as template","actual":210,"countOk":true,"isPattern":true,"slots":[],"body":"Geography per the establishing beat: camera on the [side] of the action axis, [fixed feature] reading [screen side] from this position, direction of travel [direction], unchanged from the sequence's first beat."},{"id":"HAIR-A","section":"App.A","description":"substitute [HAIR-SPEC] per character. (265)","declared":265,"declaredHi":265,"note":"","actual":265,"countOk":true,"isPattern":true,"slots":["HAIR-SPEC"],"body":"HAIR — [HAIR-SPEC], individual coarse wires standing away from the head and catching the light, flyaways going soft where they fall out of the focal plane, scalp visible along the parting, strands loose and uneven at both temples. Never smooth, never a single mass."},{"id":"HOLD-AC","section":"App.A","description":"mechanism densities A–C. Run instead of NEG-ANAT-PHYS, never both. (251)","declared":251,"declaredHi":251,"note":"","actual":251,"countOk":true,"isPattern":false,"slots":[],"body":"The anatomy keeps its structure every frame: bones hold shape, length and spacing, joints never separate or pass through each other, muscle keeps constant volume, and the layer order holds — bone deepest, muscle over it, translucent contour outermost."},{"id":"HOLD-ANAT","section":"App.A","description":"(434)","declared":434,"declaredHi":434,"note":"","actual":434,"countOk":true,"isPattern":false,"slots":[],"body":"The anatomy keeps its structure on every frame: bones hold their shape, length and spacing, joints stay articulated at correct spacing and never separate or pass through each other, muscle bellies keep constant volume, and the layer order holds throughout — bone deepest, muscle over it, the translucent outer contour outermost. Deformation is limited to the named mechanical events, and is small, controlled and anatomically correct."},{"id":"HOLD-BREAK","section":"App.A","description":"replaces HOLD-C on a break beat. Never both. (479)","declared":479,"declaredHi":479,"note":"","actual":458,"countOk":false,"isPattern":true,"slots":["OBJECT"],"body":"Only the [OBJECT] changes, and it changes only by breaking in the way described. Its pieces are pieces of it — they match its material, its colour and its thickness, and together they account for it. No piece appears from nowhere, no piece vanishes, nothing multiplies, and nothing reassembles. Everything else in frame keeps the exact form, proportion and count it has in the start frame: nothing else melts, merges, splits, grows or becomes something else."},{"id":"HOLD-C","section":"App.A","description":"universal, all modes. Never trimmed. (295)","declared":295,"declaredHi":295,"note":"","actual":295,"countOk":true,"isPattern":false,"slots":[],"body":"Everything in frame keeps the exact form, proportion and count it has in the start frame, first frame to last — nothing melts, merges, splits, grows or becomes something else. One small movement, completing inside the clip, subject fully in frame throughout, nothing leaving frame and returning."},{"id":"HOLD-FORM","section":"App.A","description":"full universal form, for beats with headroom. (398)","declared":398,"declaredHi":398,"note":"","actual":398,"countOk":true,"isPattern":false,"slots":[],"body":"Everything in frame keeps the exact form it has in the start frame for the whole clip: the same shapes, the same proportions, the same sizes relative to each other, and the same count of every object and every part. Nothing melts, merges, splits, grows, shrinks, or turns into something else. Only the movement described above happens; every other property holds unchanged from first frame to last."},{"id":"HOLD-HC","section":"App.A","description":"any person in frame. (251)","declared":251,"declaredHi":251,"note":"","actual":251,"countOk":true,"isPattern":false,"slots":[],"body":"Same person every frame: same face, bone structure, age, hair and wardrobe. Five separate fingers on each hand throughout, never fusing and never passing through anything. Limbs stay attached, keep their length, and bend only the way real joints bend."},{"id":"HOLD-HUMAN","section":"App.A","description":"(477)","declared":477,"declaredHi":477,"note":"","actual":477,"countOk":true,"isPattern":false,"slots":[],"body":"The person is the same person on every single frame: same face, same bone structure, same age, same skin, same hair length and colour, same wardrobe, same body proportions. Five fingers on each hand at all times, fingers separate, never fusing, never passing through each other or through any object they touch. Limbs stay attached and keep their length, and joints only bend the way real joints bend. Teeth keep their count and spacing. The face never reshapes between frames."},{"id":"HOLD-PC","section":"App.A","description":"PATTERN. Any beat with the product. The named-asymmetries clause never trims; the Product Sheet fills [NAMED-ASYMMETRIES]. (314 as template)","declared":314,"declaredHi":314,"note":"as template","actual":314,"countOk":true,"isPattern":true,"slots":[],"body":"The product keeps the start frame's exact geometry every frame: same silhouette, [NAMED-ASYMMETRIES — each stated as the same, e.g. the same uneven pair with the same one larger], same flexible-component width, same hardware and wordmark position. The rigid element never bends, flexes or stretches from any angle."},{"id":"HOLD-PROD","section":"App.A","description":"PATTERN; the Product Sheet fills [NAMED-ASYMMETRIES]. (477 as template)","declared":477,"declaredHi":477,"note":"as template","actual":477,"countOk":true,"isPattern":true,"slots":[],"body":"The product keeps the exact geometry of the start frame on every frame: same silhouette, same rigid-element shape, [NAMED-ASYMMETRIES — each stated as the same], same flexible-component width, same hardware position, same wordmark position and spelling. The rigid element never bends, flexes, stretches, tapers or changes proportion under any movement or from any camera angle. Only the flexible component's own elastic stretch is permitted, and it returns to its resting form."},{"id":"IFACE-C","section":"App.A","description":"compressed. The default. (363)","declared":363,"declaredHi":363,"note":"","actual":363,"countOk":true,"isPattern":false,"slots":[],"body":"The material compresses into the flesh with a shallow indentation above and below the contact line, flattening over bone and denting into the soft tissue either side — never a clean circle. Skin slightly paler underneath, faint pink at the compressed edge. Body hair flattened directional under it. Rigid element flush with a tight contact shadow beneath, no gap."},{"id":"IFACE-FULL","section":"App.A","description":"body interface, full. (691)","declared":691,"declaredHi":691,"note":"","actual":691,"countOk":true,"isPattern":false,"slots":[],"body":"Where the product crosses the body the material compresses the flesh and sits into it, a shallow soft indentation above and below the contact line rather than lying flat on the surface. It flattens over bone and dents into the soft tissue either side — it does not trace a clean circle or a clean straight line around the limb. Skin immediately under it reads very slightly paler, with faint pink at the compressed edge. Body hair flattened and lying directional under it, springing back where it clears. Small localised dimples where any interior grip elements press. The rigid element sits flush with a tight contact shadow under its lower edge and no daylight gap between it and the skin."},{"id":"INHERIT-CAP","section":"App.A","description":"I2V replacement for the capture block. (146)","declared":146,"declaredHi":146,"note":"","actual":146,"countOk":true,"isPattern":false,"slots":[],"body":"Capture characteristics exactly as in the start frame — same tone-mapping, same noise, same colour temperature. No grading change across the clip."},{"id":"INHERIT-ENV","section":"App.A","description":"(100)","declared":100,"declaredHi":100,"note":"","actual":100,"countOk":true,"isPattern":false,"slots":[],"body":"Location, surface, dressing and light exactly as in the start frame. Nothing added, nothing removed."},{"id":"INHERIT-SUBJ","section":"App.A","description":"(58)","declared":58,"declaredHi":58,"note":"","actual":58,"countOk":true,"isPattern":false,"slots":[],"body":"Exactly as in the start frame, unchanged in every respect."},{"id":"LIGHT-EVENT","section":"App.A","description":"every face-subject candid seed. Never trimmed: the terminator clause and the stop-under clause. (608 as template)","declared":608,"declaredHi":608,"note":"as template","actual":608,"countOk":true,"isPattern":true,"slots":["SIDE"],"body":"THE LIGHT IS ONE HARD EVENT. Low sun through [SOURCE — the vertical blinds / the window / the open door] to [SIDE] lands as a bright band across the [SIDE] side of the face, and the edge where the sun stops runs down across the near cheek; the other side of the face is in open shadow lifted only by bounce off [BOUNCE — the pale wall / the worktop / the floor]. The window has blown to flat white with a faint HDR halo along its edges, the room away from it sits a stop under and goes muddy with sensor noise in the far corner. The face is the one thing in focus; everything nearer and further falls softer."},{"id":"LOC-BATHROOM","section":"App.A","description":"cold interior. *Unverified — visual check pending.* (428)","declared":428,"declaredHi":428,"note":"","actual":428,"countOk":true,"isPattern":false,"slots":[],"body":"Cool overhead vanity light as the key, slightly green-white, flat and unflattering, bounced hard off white tile and mirror so shadows sit shallow, highlights clipping on the tile and the mirror edge, mild sensor noise in the corners away from the tile bounce. Ambient palette cold white and pale tile tones, the least warm room in the build, skin reading slightly grey-green under the fixture as a phone captures it uncorrected."},{"id":"LOC-EXT-OVERCAST","section":"App.A","description":"grey exterior. *Unverified — visual check pending.* (374)","declared":374,"declaredHi":374,"note":"","actual":374,"countOk":true,"isPattern":false,"slots":[],"body":"Broad overcast sky as the single source, directionless and soft, shadows shallow and open under the brow and chin, the sky itself blown white wherever it enters frame, no sensor noise. Ambient palette desaturated and slightly cool, greens and greys muted, skin reading paler and flatter than indoors, colours compressed the way a phone renders a grey day without correction."},{"id":"LOC-EXT-SUN","section":"App.A","description":"hard sun exterior. Visually confirmed this cycle. (519)","declared":519,"declaredHi":519,"note":"","actual":519,"countOk":true,"isPattern":false,"slots":[],"body":"Hard direct sun from upper camera-left, deep short shadows under the brow, nose and chin, blown highlights on the forehead, one shoulder and any pale surface in frame, strong warm bounce lifting the shadow side from the ground, no sensor noise — bright capture is clean. Ambient palette high-contrast and warm, saturated colour in the lit areas falling out of focus behind, shadows dropping toward neutral, the sky blown white wherever it enters frame, Smart HDR visibly fighting the range and flattening the mid-tones."},{"id":"LOC-HARDBAND","section":"App.A","description":"hard-edged interior sun band. The texture profile: any beat where skin carries the shot takes this or another hard key. Substitute [SIDE]. (unverified — visual check pending) (510)","declared":510,"declaredHi":510,"note":"","actual":510,"countOk":true,"isPattern":true,"slots":["SIDE"],"body":"A hard-edged band of low sun comes through the gap under a half-lowered blind [SIDE] and falls across the face at a shallow skimming angle, wide enough to cover most of the face from brow to jaw, with a crisp edge where it stops. The rest of the face sits in dull shadow lifted only by bounce off the room. Where the band lands the texture is lit brutally from the side. Sun through the rim of the near ear lighting it translucent red. Highlights blowing hard inside the band. No sensor noise in the lit areas."},{"id":"LOC-KITCHEN-DAY","section":"App.A","description":"cool daylight interior. Visually confirmed this cycle. (613)","declared":613,"declaredHi":613,"note":"","actual":613,"countOk":true,"isPattern":false,"slots":[],"body":"Cool overcast daylight as the key from a large window camera-right at roughly forty-five degrees off axis, flat and broad, mixing against a faint warm under-cabinet practical camera-left, the window side of the subject and the worktop a stop brighter and cooler than the room side, highlights blowing at the window edge and on the white worktop, falloff landing into the hallway behind, no sensor noise — bright capture is clean. Ambient palette cool neutral lifted by the worktop bounce, colours slightly flat under overcast light as a phone renders them, the under-cabinet warmth the only warm element in frame."},{"id":"LOC-KITCHEN-MORN","section":"App.A","description":"morning daylight kitchen. (unverified — visual check pending) (553) (553)","declared":553,"declaredHi":553,"note":"","actual":553,"countOk":true,"isPattern":false,"slots":[],"body":"Morning daylight through a window over the sink camera-right at roughly forty-five degrees off axis, broad and even across the whole kitchen, worktops and cupboard fronts bright to the back of the room, shadows shallow and open under the wall units with detail held. Highlights clipping on the window frame, the tap and any white worktop. No sensor noise — bright capture is clean. Ambient palette clean neutral daylight with a faint warm cast off wooden cupboard doors, colours slightly flat the way a phone renders a bright kitchen without correction."},{"id":"LOC-LIVING-DAY","section":"App.A","description":"daylight living room. The default realism profile. (unverified — visual check pending) (678) (678)","declared":678,"declaredHi":678,"note":"","actual":678,"countOk":true,"isPattern":false,"slots":[],"body":"Broad daylight through a large window camera-left at roughly forty-five degrees off axis, filling the whole room evenly rather than pooling — the far wall, the ceiling corner and the back of the sofa all clearly lit, shadows open and soft with detail held inside them. A faint warm bounce off a wooden floor or a beige carpet lifting the shadow side of the face. Highlights blowing at the window itself and on any white paintwork beside it, mid-tones sitting bright. No sensor noise — bright capture is clean. Ambient palette natural and slightly cool from the window, warmed where the room's own furnishings bounce back into it, colours as a phone renders daylight uncorrected."},{"id":"LOC-LIVING-EVE","section":"App.A","description":"warm interior, evening. Visually confirmed this cycle. (526)","declared":526,"declaredHi":526,"note":"","actual":526,"countOk":true,"isPattern":false,"slots":[],"body
