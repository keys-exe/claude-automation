":"Single warm tungsten lamp as the key, camera-left at roughly forty-five degrees off axis, everything else falling off fast into warm darkness, a faint cool blue spill from a television off-frame edging the shadow side of the subject, highlight clipping on the lampshade and the nearest lit upholstery, visible sensor noise through the shadows and mid-tones and mildly across the face. Ambient palette deep amber and brown, saturated near the lamp, desaturating into the dark, the cool spill the only non-warm element in frame."},{"id":"M3-EYES","section":"App.A","description":"stylized ocular spec. Modes 2 and 3. Mode 4 inverts the iris clause — see M4-FACE. (346)","declared":346,"declaredHi":346,"note":"","actual":346,"countOk":true,"isPattern":false,"slots":[],"body":"A single bright specular catchlight in each eye, positioned to match the key direction, present in every frame. Iris dominant in the eye opening with sclera visible but the minority. Eyes track and lead — the gaze arrives at a target before the head finishes turning. Lids and brows carry the expression; the mouth supports it, never replaces it."},{"id":"M3-LIGHT","section":"App.A","description":"stylized lighting design. Modes 2 and 3. Mode 4 substitutes M4-BASE. (504)","declared":504,"declaredHi":504,"note":"","actual":504,"countOk":true,"isPattern":false,"slots":[],"body":"Three named sources, never ambient-only: a key with a stated direction and colour temperature, a fill at roughly a quarter the key's strength in a complementary hue, and a rim separating the silhouette from the background. Soft global illumination with visible colour bleed from nearby surfaces into the shadow side. Ambient occlusion tight in the crevices — under the chin, inside fabric folds, where the feet meet the ground. Shallow depth of field only to separate character from set, never as a look."},{"id":"M3-MOTION","section":"App.A","description":"stylized motion arc. Modes 2, 3, 4. Never trimmed (§37). (404)","declared":404,"declaredHi":404,"note":"","actual":404,"countOk":true,"isPattern":false,"slots":[],"body":"No true stillness at any point. Every action opens with a small anticipation in the opposite direction before it begins. Hair, cloth and loose elements continue moving after the body stops — overlap and follow-through, never settling on the same frame as the body. Holds are moving holds: the pose sustains while the character keeps breathing, shifting weight and blinking. Ends mid-hold, still drifting."},{"id":"M3-SHAPE","section":"App.A","description":"shape language. Modes 2, 3, 4. (429)","declared":429,"declaredHi":429,"note":"","actual":429,"countOk":true,"isPattern":false,"slots":[],"body":"One dominant shape drives the character — round, square, or triangular — and every major mass repeats it: head, torso, hands, overall silhouette. One contrasting shape appears exactly once, as the accent that stops the design reading as generic. The silhouette must be readable filled solid black at thumbnail size. One charm marker breaks the symmetry — a cowlick, a gap tooth, one ear sitting higher, freckles on one side only."},{"id":"M4-ANIMAL","section":"App.A","description":"animals as Mode 4 characters. (300)","declared":300,"declaredHi":300,"note":"","actual":300,"countOk":true,"isPattern":false,"slots":[],"body":"Accurate species anatomy, coat and proportion, with two human features added: sharply shaped expressive eyebrows set above the eye, and a mouth capable of a closed asymmetric smirk. Eyes placed forward enough to hold a sidelong glance. Never a full anthropomorphic body, never bipedal, never clothed."},{"id":"M4-BASE","section":"App.A","description":"Mode 4 render and lighting. (468)","declared":468,"declaredHi":468,"note":"","actual":468,"countOk":true,"isPattern":false,"slots":[],"body":"High-end stylized 3D animated feature render, feature-quality CGI. Warm practical domestic lighting — lamp light, window light, kitchen light — with a strong warm key and a cooler fill. Visible rim light separating the character from the background. Aggressive shallow depth of field: the background falls to soft defocus within a foot of the subject, with round bokeh discs on any practical light in frame. Rich warm grade, deep saturated shadows, glowing highlights."},{"id":"M4-FACE","section":"App.A","description":"Mode 4 character design. (490)","declared":490,"declaredHi":490,"note":"","actual":490,"countOk":true,"isPattern":false,"slots":[],"body":"Caricatured adult proportions, roughly six heads tall, sculpted cheek and jaw planes. Heavy dark eyebrows, thick and sharply shaped, carrying most of the expression. Eyes large but sclera-dominant — a small-to-mid dark iris sitting in a wide visible white, never the iris-filled Disney eye. Skin glossy with visible specular on the nose bridge, forehead and cheekbones, never matte. Hair in sculpted clumped masses with a soft specular sheen along the top surface, never individual strands."},{"id":"M4-PERF","section":"App.A","description":"the Mode 4 signature. Sets the resting register only; §28A and §28E still govern the arc. (351)","declared":351,"declaredHi":351,"note":"","actual":351,"countOk":true,"isPattern":false,"slots":[],"body":"Default expression is knowing, not sincere: eyes cut off-axis to one side rather than to the lens, one eyebrow raised higher than the other, mouth closed in a small asymmetric smirk pulled to one side. Head turned slightly away from the direction the eyes are looking, so the glance reads sidelong rather than direct. The character is in on something."},{"id":"M4-SPLIT","section":"App.A","description":"controlled register split. The one authorised intra-shot blend in the document (§2). (385)","declared":385,"declaredHi":385,"note":"","actual":385,"countOk":true,"isPattern":false,"slots":[],"body":"Controlled register split inside the frame. Character, skin, hair and clothing are stylized. Held objects, food, packaging and product carry near-photoreal materials — real surface texture, real translucency, real specular response — at stylized scale on simplified forms. Environment surfaces are photoreal materials on simplified forms: real wood grain, real tile, real fabric weave."},{"id":"M5-BASE","section":"App.A","description":"Mode 5 core. Opens every Mode 5 T2I. (347)","declared":347,"declaredHi":347,"note":"","actual":347,"countOk":true,"isPattern":false,"slots":[],"body":"Stop-motion animation, photographed frame by frame on a real miniature set with a real camera. Not a 3D render and not an illustration: every object in frame is a physical object that was built, lit and photographed at small scale. Handmade plasticine characters on wire armatures, tabletop set, practical lighting, real macro-lens depth of field."},{"id":"M5-BOIL","section":"App.A","description":"the frame-to-frame simmer. I2V, and stated in T2I as surface irregularity. Never trimmed. (378)","declared":378,"declaredHi":378,"note":"","actual":378,"countOk":true,"isPattern":false,"slots":[],"body":"THE BOIL — the surface is never identical between frames, because a human touched the puppet between every exposure. Thumbprints shift and reappear slightly differently, edges creep, small blemishes come and go, and the whole surface simmers faintly from frame to frame even where nothing is meant to be moving. It is most visible on the face and on any large flat area of clay."},{"id":"M5-CAPCUT","section":"App.A","description":"the standing edit lines for every Mode 5 build (§40). (255)","declared":255,"declaredHi":255,"note":"","actual":255,"countOk":true,"isPattern":false,"slots":[],"body":"Standing Mode 5 lines: posterize time to twelve frames a second across every Mode 5 clip · do not stabilise, do not denoise, do not frame-blend — all three destroy the boil · no motion blur added at any point · retime before any speed change, never after."},{"id":"M5-DIAGRAM","section":"App.A","description":"the sculpted mechanism diagram. The Mode 5 mechanism register (§12A). (568)","declared":568,"declaredHi":568,"note":"","actual":568,"countOk":true,"isPattern":false,"slots":[],"body":"A sculpted explanatory diagram standing in the world as a physical object: a plasticine leg in flat profile modelled in relief on a painted card panel, propped or floating at the character's shoulder, everything on it made of clay and cut card rather than drawn. The marks are objects too — a pressed red clay disc for the site, a thick clay arrow with visible thumbprints along its shaft, a hand-cut card ring — each with real thickness, casting its own small hard shadow onto the panel behind it. Same tabletop light and same handled surfaces as the rest of the set."},{"id":"M5-FACE","section":"App.A","description":"clay character heads. Replaces §24C's iris rule and §28F's jaw hierarchy in this mode. (373)","declared":373,"declaredHi":373,"note":"","actual":373,"countOk":true,"isPattern":false,"slots":[],"body":"Face built for animation: a sculpted plasticine head with a shallow brow, large simple eyes as glossy beads or painted spheres set into the clay, and a separate mouth shape pressed on for each sound. Expression is carried by the whole head — the brow reshaped by hand, the head tilted on its armature neck — never by fine facial detail, because there is none at this scale."},{"id":"M5-LIGHT","section":"App.A","description":"tabletop practical lighting. Replaces M3-LIGHT in Mode 5. (445)","declared":445,"declaredHi":445,"note":"","actual":445,"countOk":true,"isPattern":false,"slots":[],"body":"Lit by small hard practical sources close to the set, the way a tabletop rig is lit: a hard key throwing a crisp little shadow across the surface, one warmer fill from the opposite side, and a rim separating the puppet from the backdrop. Falloff is fast because the lamps are close to a small subject. Any lamp built into the set itself is genuinely lit and blows out. Shadows have hard edges and land on the tabletop, never a soft ambient wash."},{"id":"M5-MAT","section":"App.A","description":"the handled surface. The block that produces the mode. Never trimmed. (650)","declared":650,"declaredHi":650,"note":"","actual":650,"countOk":true,"isPattern":false,"slots":[],"body":"THE CLAY IS HANDLED MATERIAL, NOT A SMOOTH SURFACE — plasticine carrying the marks of the hands that made it: thumbprints and fingertip whorls pressed into the cheeks and limbs, thin tool grooves where the sculptor shaped an edge, faint smearing where two colours have been blended by hand, a low uneven sheen from being warmed and worked rather than an even gloss. Dust, a hair and a scrap of lint stuck in the surface here and there. Visible seams where the head meets the neck and the limbs meet the body, with a slight bulge over the armature underneath. Nothing is symmetrical, nothing is machine-smooth, and no two surfaces are the same finish."},{"id":"M5-MOTION","section":"App.A","description":"I2V motion. Supersedes M3-MOTION in Mode 5. (556)","declared":556,"declaredHi":556,"note":"","actual":556,"countOk":true,"isPattern":false,"slots":[],"body":"Movement is STEPPED, NOT SMOOTH — animated on twos at roughly twelve poses a second, so every action reads as a rapid series of held positions rather than continuous motion. Small mechanical jitter at the start and end of each move where the animator repositioned the puppet. Weight and follow-through are real because the armature is real: limbs settle a frame or two after the body stops. No motion blur on anything, ever — each frame is a still photograph of a stationary object, so fast movement reads as a crisp jump between poses rather than a smear."},{"id":"M5-PROD","section":"App.A","description":"the product in a clay world. Never trimmed. (409)","declared":409,"declaredHi":409,"note":"","actual":409,"countOk":true,"isPattern":false,"slots":[],"body":"The product is the REAL PRODUCT, not a clay version of it: actual materials, actual finish, actual hardware, sitting on the miniature set as a real object at the correct size relative to the puppet. It is the one thing in frame that was not sculpted, and it reads that way — harder edges, truer colour, a finish the clay does not have. Never modelled in plasticine, never given thumbprints, never given seams."},{"id":"M5-PUPPET","section":"App.A","description":"puppet consistency. Opens every beat a locked puppet appears in, reference attached. Substitute the named sculpt asymmetries. (357)","declared":357,"declaredHi":357,"note":"","actual":357,"countOk":true,"isPattern":true,"slots":["NAMED SCULPT ASYMMETRIES"],"body":"The same puppet exactly as in the attached reference image, unchanged in sculpt and colour — [NAMED SCULPT ASYMMETRIES] — the same clay colours mixed the same way, the same seam positions at neck and shoulders, the same eyes set at the same depth and spacing, the same height relative to the set. Only its pose and its mouth shape differ from the reference."},{"id":"M5-SCALE","section":"App.A","description":"miniature scale cues. (349)","declared":349,"declaredHi":349,"note":"","actual":349,"countOk":true,"isPattern":false,"slots":[],"body":"Everything reads as small and close: the depth of field is shallow enough that only a few centimetres are sharp, dust sits large on the surfaces relative to the props, fabric weave and paint texture read coarse because they are real materials at a fraction of normal scale, and cut edges, glue marks and card thickness are visible on the set pieces."},{"id":"M5-SET","section":"App.A","description":"miniature set and macro lens. (545)","declared":545,"declaredHi":545,"note":"","actual":545,"countOk":true,"isPattern":false,"slots":[],"body":"MINIATURE SET — everything in frame is built at small scale and photographed close: card and painted-wood walls with visible brush texture, fabric at a scale where the weave reads coarse, real miniature props with glue marks and cut edges. Small hard practical sources light it, throwing crisp little shadows onto the tabletop. Real macro-lens depth of field, so the focal plane is genuinely shallow and the set falls off fast behind the puppet — the softness comes from a lens photographing a small object, never from a blur applied afterwards."},{"id":"M5-SPEAK","section":"App.A","description":"off-mouth dialogue coverage. Replaces §28F entirely in Mode 5. (434)","declared":434,"declaredHi":434,"note":"","actual":434,"countOk":true,"isPattern":false,"slots":[],"body":"The character is speaking, and the shot is framed so the mouth is not the subject: seen from behind or in three-quarter rear, in profile with the far side of the face turned away, over the listener's shoulder, or cut to their hands and what they are holding while the voice carries. The head moves with the speech — turning, tilting, nodding on the beat — and the body carries the performance. The mouth is never front-on to the lens."},{"id":"M5-TYPE","section":"App.A","description":"clay-styled post layer. CapCut instruction, never a prompt. (360)","declared":360,"declaredHi":360,"note":"","actual":360,"countOk":true,"isPattern":false,"slots":[],"body":"Mode 5 type and graphics are clay-styled in the edit: lettering set to read as rolled or pressed plasticine with uneven strokes and a slight drop shadow, marks and rings drawn with a hand-wobbled edge rather than a vector-true one, everything on twos with the rest of the picture. Never a clean sans-serif, never a flat vector arrow, never a UI-styled callout."},{"id":"MOOD-NEG","section":"App.A","description":"negative-valence lifestyle B-roll. (490)","declared":490,"declaredHi":490,"note":"","actual":490,"countOk":true,"isPattern":false,"slots":[],"body":"The beat is a bad moment and the frame carries it. FACE — closed and set, eyes down or fixed on the obstacle, jaw tight, the expression absorbed rather than performed. BODY — guarded, weight held off one side, movement slower and more careful than it needs to be, shoulders up. LIGHT — the dull end of the location's profile: flat, sourceless, colour drained out of the walls and the wardrobe. LIFE — the frame is empty and the house is quiet: nobody else, nothing moving, no task underway."},{"id":"MOOD-POS","section":"App.A","description":"positive-valence lifestyle B-roll. T2I, after the Location Profile. (706)","declared":706,"declaredHi":706,"note":"","actual":706,"countOk":true,"isPattern":false,"slots":[],"body":"The beat is a good moment and the frame carries it. FACE — lifted and open, eyes up and out at what she is doing rather than down at herself, the corners of the mouth going before anything else does, and the expression is a REACTION TO SOMETHING HAPPENING IN FRAME, never an expression worn for the camera. BODY — upright, shoulders down and loose, weight moving freely, the action quicker and lighter than it would have been. LIGHT — the bright end of the location's profile: real sun in the room, warm bounce, colour holding in the walls and the wardrobe, nothing grey. LIFE — the frame is not empty: another person, an animal, a task underway, something moving at depth. The room is occupied and in use."},{"id":"MOUNT-CLEAN","section":"App.A","description":"the angle-only register. Runs with CAP-A and the full §22S skin stack; CAP-CCTV and NEG-CCTV are absent. (341)","declared":341,"declaredHi":341,"note":"","actual":319,"countOk":false,"isPattern":false,"slots":[],"body":"This is an ordinary sharp well-exposed photograph that simply happens to have been taken from a camera fixed high on the wall — a normal file, correct colour, real detail throughout, no degradation of any kind. The only unusual thing about it is where the camera is and that nobody was holding it or looking through it."},{"id":"MOUNT-GEOM","section":"App.A","description":"the geometry. Mandatory alongside any angle block, in all three registers. Never trimmed. (806)","declared":806,"declaredHi":806,"note":"","actual":805,"countOk":false,"isPattern":false,"slots":[],"body":"Because the camera is fixed high and tilted down on a wide short lens, the whole picture behaves accordingly: a little of the structure the camera is mounted on is visible across the top of frame, upright lines lean inward toward the top rather than standing square, and everything from just below the lens to the far end of the space is equally sharp with no background blur anywhere. Between half and two thirds of the frame is floor, path or worktop carrying nothing at all. Surfaces are seen from above as flat planes rather than as edges, so the tops of things are visible. Anything close below the camera reads enormous while anything far away reads very small. The frame covers the whole space, and the person is small within it, off to one side, partly cut by the frame or partly behind something."},{"id":"MOUNT-PERSON","section":"App.A","description":"append where a person is the subject under any mount. (437)","declared":437,"declaredHi":437,"note":"","actual":434,"countOk":false,"isPattern":false,"slots":[],"body":"Seen from above and in front, the person is strongly foreshortened: head and shoulders large and close to the lens, the body compressed below them, the legs short and the feet small and far away at the bottom of the frame. Walking toward the camera they grow mostly in the head and shoulders. The top of the head and the tops of the shoulders are the most visible parts of them, and the face is angled away and downward from the lens."},{"id":"MOUTH-A","section":"App.A","description":"full, talking heads. Substitute [CLOSURE-WORD], [MOUTH-CORNER]. (706)","declared":706,"declaredHi":706,"note":"","actual":700,"countOk":false,"isPattern":true,"slots":["CLOSURE-WORD","MOUTH-CORNER"],"body":"Speech is carried by the jaw, visibly dropping on open vowels with the lips shaping over it — never lips fluttering on a static jaw. Mouth amplitude is conversational and small, matched to the voice register: opening a fraction, teeth mostly hidden, lips barely clearing on unstressed syllables. The face moves with the mouth — cheeks and naso 's not-states, every talking-head beat. (155)","declared":155,"declaredHi":155,"note":"","actual":153,"countOk":false,"isPattern":false,"slots":[],"body":"Brisk throughout with no trailing pauses, no held silences mid-line, no slow fades of energy at sentence ends — each sentence hands straight to the next."},{"id":"PHYS-BREAK","section":"App.A","description":"full chain, for beats assembling it in one clause. (566 as template)","declared":566,"declaredHi":566,"note":"as template","actual":446,"countOk":false,"isPattern":true,"slots":["NAMED PART","SURFACE"],"body":"One event in order, never all at once: it falls accelerating and turning, the [NAMED PART] meets [SURFACE] at one point, and immediately after that contact — not on the same frame — it fails. [MATERIAL FAILURE, from the taxonomy]. The pieces then travel outward, slowing with friction across the surface, some sliding and some turning. Nothing happens before the contact and nothing is undone after it. Something is still moving as the clip ends."},{"id":"PHYS-BREAK-C","section":"App.A","description":"compressed. The 3s default. (304 as template)","declared":304,"declaredHi":304,"note":"as template","actual":281,"countOk":false,"isPattern":true,"slots":["NAMED PART","SURFACE","MATERIAL FAILURE"],"body":"In order: falling and accelerating, the [NAMED PART] meets [SURFACE] at one point, and immediately after — not on the same frame — [MATERIAL FAILURE]. Pieces travel outward and slow with friction. Nothing happens before contact and nothing is undone after. Still moving at the cut."},{"id":"PHYS-FALL","section":"App.A","description":"the approach. Substitute the object and the surface. (412 as template)","declared":412,"declaredHi":412,"note":"as template","actual":343,"countOk":false,"isPattern":true,"slots":["SURFACE","NAMED PART"],"body":"Already falling on the first frame, well below the height it left and accelerating, turning slowly as it goes so it is not level when it lands. It falls at real speed — quick, ordinary, over in a moment, never drifting and never in slow motion. It is about to land on [SURFACE], and the [NAMED PART] is the part that reaches the surface first."},{"id":"PHYS-FRAME","section":"App.A","description":"T2I, after the capture block. Every human or object still. (635) (635)","declared":635,"declaredHi":635,"note":"","actual":635,"countOk":true,"isPattern":false,"slots":[],"body":"Everything in frame obeys weight and support: the body's load is visibly distributed — which foot carries it, which hand braces, shoulders answering the lean; fabric hangs from its contact points, creasing at every joint, pooling where it lands, never floating or frozen mid-air; every object rests on something and shows it — compressed cushion under weight, a tight contact shadow at every touch point, nothing hovering; soft things deform under hard things and skin dents under pressure; anything mid-state is honest — liquid level tilted if the vessel tilts, steam bending with the room's air, a cord hanging in a natural catenary."},{"id":"PHYS-FRAME-C","section":"App.A","description":"compressed. The default on dense T2I. (271) (271)","declared":271,"declaredHi":271,"note":"","actual":271,"countOk":true,"isPattern":false,"slots":[],"body":"Weight and support everywhere: body load visibly on one foot or braced hand, fabric hanging from contact points and creasing at joints, every object resting on something with a tight contact shadow, soft deforming under hard, liquids level with gravity, nothing floating."},{"id":"PHYS-MOTION","section":"App.A","description":"I2V motion, after the §27A arc. (620) (620)","declared":620,"declaredHi":620,"note":"","actual":620,"countOk":true,"isPattern":false,"slots":[],"body":"All movement carries mass and momentum: heavy things start slow and settle slow, light things respond first; nothing moves at uniform speed and nothing stops instantly — every motion decelerates into a small settle, overshoot or rock before stilling; every action starts somewhere in the body and travels — weight transfers before a step, the hips lead the torso, the hand arrives last and decelerates into contact; loose elements — hair, fabric, straps, cords — lag the body and keep moving briefly after it stops; surfaces resist: objects drag and scrape rather than glide, grip shifts under load, friction is visible."},{"id":"PHYS-MOTION-C","section":"App.A","description":"compressed. The default. (358) (358)","declared":358,"declaredHi":358,"note":"","actual":358,"countOk":true,"isPattern":false,"slots":[],"body":"Mass and momentum in all movement: heavy starts and settles slow, nothing at uniform speed, nothing stops instantly — motions decelerate into a settle or small overshoot; actions travel through the body, weight transferring first, hands arriving last; hair, fabric and straps lag and keep moving after the body stops; objects drag with friction, never glide."},{"id":"PHYS-SPILL","section":"App.A","description":"the contents. The half that sells it. (472)","declared":472,"declaredHi":472,"note":"","actual":425,"countOk":false,"isPattern":false,"slots":[],"body":"The liquid leaves before the pieces come to rest, thrown ahead of the break rather than following it, and it travels further across the floor than any piece does. It spreads as an irregular sheet with an uneven leading edge, never a circle, running into the joins and low points of the surface. It darkens everything it touches and soaks in rather than beading wherever the surface takes it. It is still spreading at the cut."},{"id":"PLACE-BENT","section":"App.A","description":"PATTERN. Every worn beat with the joint flexed: seated, kneeling, stairs, rising. T2I, in the subject description alongside PLACE-LOCK. The fill is Product Sheet content. (707 as template)","declared":707,"declaredHi":707,"note":"as template","actual":707,"countOk":true,"isPattern":true,"slots":["JOINT","LANDMARK","RIGID","SEGMENT-BEYOND","HARDWARE","BAND-MATERIAL"],"body":"With [JOINT] bent [LANDMARK] stands out as a distinct bulge and the [RIGID] sits directly beneath it: [CONTACT — the product's own contact geometry receiving the landmark along its whole extent, the landmark's flesh pressing into it and filling it with no gap of bare skin anywhere between them, and the named asymmetries flanking it]. [LANDMARK]'s own face stays completely uncovered above the [RIGID], its outline reading in full. The [RIGID]'s body carries on onto [SEGMENT-BEYOND]. [HARDWARE] at each outer margin of the limb with the [BAND-MATERIAL] band running back from it. The [RIGID] never rotates with the joint — the contact geometry stays engaged with [LANDMARK] through every angle of flexion."},{"id":"PLACE-LOCK","section":"App.A","description":"every worn beat, every register (§9A-P). (378 before substitution)","declared":378,"declaredHi":378,"note":"before substitution","actual":378,"countOk":true,"isPattern":true,"slots":["SIDE","REGION","LANDMARK"],"body":"The product is worn on the [SIDE] [REGION], already fully and correctly in place: [ITS CONTACT RELATIONSHIP TO [LANDMARK] — the geometry that sets its height, stated as contact rather than as a measurement], sitting slim and flush against the body with the wordmark horizontal and readable. [LANDMARK] stays completely uncovered and clearly visible, its outline reading in full."},{"id":"PLACE-PROFILE","section":"App.A","description":"PATTERN. Side and three-quarter worn beats. The clause that stops a wrapped product rendering as a flat panel. The fill is Product Sheet content. (607 as template)","declared":607,"declaredHi":607,"note":"as template","actual":607,"countOk":true,"isPattern":true,"slots":["JOINT","RIGID","HARDWARE","BAND-MATERIAL"],"body":"Seen from the side or three-quarter with [JOINT] bent, the [RIGID] wraps far enough around the limb that most of its face still reads: [the named asymmetries as they read in profile — which one curls toward the front, where the contact geometry dips under the landmark], and the l":164,"countOk":true,"isPattern":true,"slots":[],"body":"The product exactly as in the attached reference image — [the Product Sheet's named asymmetries, materials, hardware and wordmark placement, stated in one clause] —"},{"id":"RIG-R1","section":"App.A","description":"handheld, planted, full. (481)","declared":481,"declaredHi":481,"note":"","actual":481,"countOk":true,"isPattern":false,"slots":[],"body":"Camera already drifting on the first frame, never static at entry. Continuous low-amplitude breath sway throughout, roughly one cycle per two seconds, mostly vertical with a slight roll. Focus soft for a moment at entry, then settles. One deliberate reframe in the back half as the operator notices the subject sitting off-centre — corrects part of the way, not fully. Camera lags behind the subject, never anticipates it and never moves with it. Still drifting on the final frame."},{"id":"RIG-R1C","section":"App.A","description":"compressed. (209)","declared":209,"declaredHi":209,"note":"","actual":209,"countOk":true,"isPattern":false,"slots":[],"body":"Already drifting on frame one. Low breath sway throughout, vertical with slight roll. Brief focus hunt at entry. One late partial reframe. Camera lags the subject, never anticipates. Still drifting at the cut."},{"id":"RIG-R1F","section":"App.A","description":"handheld, fast push. (335)","declared":335,"declaredHi":335,"note":"","actual":335,"countOk":true,"isPattern":false,"slots":[],"body":"Already moving fast on frame one, operator committed to the move before the clip starts. Hard push toward the subject with the handheld sway riding on top of it, amplitude rising as the move accelerates. Framing loose and never recovering. No focus hunt — no time for one. Still travelling on the final frame, the cut landing mid-move."},{"id":"RIG-R1W","section":"App.A","description":"handheld, walking. (251)","declared":251,"declaredHi":251,"note":"","actual":251,"countOk":true,"isPattern":false,"slots":[],"body":"Operator walking. Vertical gait bounce, roughly one cycle per step, layered over a slower breath sway, with a slight lateral swing. Framing loose and constantly recovering, never settling. Never smoothed, never glided. Still moving on the final frame."},{"id":"RIG-R2","section":"App.A","description":"selfie-held. (263)","declared":263,"declaredHi":263,"note":"","actual":263,"countOk":true,"isPattern":false,"slots":[],"body":"Phone held at arm's length in one hand. Faster, tighter jitter than a two-handed hold, carried in the wrist. Subject scale changes very slightly across the take as the elbow settles. Frame drifts gradually downward, uncorrected. Still drifting on the final frame."},{"id":"RIG-R2B","section":"App.A","description":"selfie, pointed away from the face. (320) (320)","declared":320,"declaredHi":320,"note":"","actual":320,"countOk":true,"isPattern":false,"slots":[],"body":"Phone held at arm's length in one hand, pointed down or away at the subject's own body rather than the face. Wrist-borne jitter, faster and tighter than a two-handed hold. Framing drifts as the arm tires and the elbow settles, uncorrected. Free hand enters frame to indicate or adjust. Still drifting on the final frame."},{"id":"RIG-R3","section":"App.A","description":"propped, full. (319)","declared":319,"declaredHi":319,"note":"","actual":319,"countOk":true,"isPattern":false,"slots":[],"body":"Phone propped on a surface, not held and not on a tripod. A small settle in the first moment as the prop takes the weight, then near-stillness — a very slow drift that never resolves. Framing sits slightly off-level and stays off-level, because nobody is holding it to correct it. No sway, no reframe, no push, no zoom."},{"id":"RIG-R3C","section":"App.A","description":"compressed. The default on every VSL talking head. (143)","declared":143,"declaredHi":143,"note":"","actual":143,"countOk":true,"isPattern":false,"slots":[],"body":"Propped, not held, not tripod. Small settle at entry, then near-stillness with a slow unresolved drift. Slightly off-level and never corrected."},{"id":"RIG-R4","section":"App.A","description":"stabilised hero product. (154)","declared":154,"declaredHi":154,"note":"","actual":154,"countOk":true,"isPattern":false,"slots":[],"body":"Slow single-direction move on a stabilised rig, one axis only, constant speed. No sway, no reframe, no focus hunt. Move continues through the final frame."},{"id":"RIG-R5","section":"App.A","description":"POV, first person. Inverts the camera-lag rule. (542) (542)","declared":542,"declaredHi":542,"note":"","actual":542,"countOk":true,"isPattern":false,"slots":[],"body":"Camera is the subject's own eyes, roughly at head height, never a mount. Already unstable on frame one — the small continuous motion of a head on a neck, faster and less regular than a handheld hold. The camera leads: the view arrives at the target fractionally before the hand or foot does, because the eyes go first. The subject's own limbs enter frame from the bottom and the edges, never centred, often cropped. One head turn or downward look inside the clip, arriving and settling only part of the way. Still drifting on the final frame."},{"id":"RIG-R5C","section":"App.A","description":"compressed. The default. (239) (239)","declared":239,"declaredHi":239,"note":"","actual":239,"countOk":true,"isPattern":false,"slots":[],"body":"POV, camera at head height. Already unstable on frame one, head-on-neck motion. Camera leads the hand — the view arrives before the limb does. Own limbs enter from the bottom edge, cropped. One partial head turn. Still drifting at the cut."},{"id":"RIG-R6","section":"App.A","description":"stop-motion tabletop rig, Mode 5 only. (379)","declared":379,"declaredHi":379,"note":"","actual":379,"countOk":true,"isPattern":false,"slots":[],"body":"Camera locked to the tabletop rig and moved by hand a fraction between exposures, so any move arrives as a series of small even steps rather than a glide — a slow steady push or lateral track with a faint mechanical stutter riding on it. No sway, no drift, no focus hunt, no handheld physics: the camera is bolted down and nobody is holding it. Still stepping on the final frame."},{"id":"RIG-R7","section":"App.A","description":"fixed security mount. The only rig with no camera motion; the four-part arc moves onto the encoding. (556)","declared":556,"declaredHi":556,"note":"","actual":536,"countOk":false,"isPattern":false,"slots":[],"body":"The camera does not move at all: bolted high on a wall bracket, no operator, no drift, no sway, no reframe, no focus hunt, no zoom. What moves is the recording. Already stuttering on the first frame, the frame rate low and uneven throughout so movement arrives in small steps rather than smoothly and carries no motion blur at all. Once inside the clip, as something moves quickly, the compression visibly breaks down for a moment — the moving shape smearing into blocks before the picture recovers. Still stuttering on the final frame."},{"id":"RIG-RV","section":"App.A","description":"virtual orbit, full. (589)","declared":589,"declaredHi":589,"note":"","actual":589,"countOk":true,"isPattern":false,"slots":[],"body":"Virtual camera already in motion on the first frame, never static at entry. A slow continuous lateral orbit around the target, unbroken, at a constant unhurried rate, with a gentle push carrying it inward at the same time. Mechanically smooth — no sway, no bounce, no handheld physics, no focus hunt, no reframe. Total orbit stays within a narrow arc, never approaching a full revolution, and the product wordmark stays readable throughout. Target centred and dominant the whole time. Still orbiting and still pushing on the final frame, the move never completing and never coming to rest."},{"id":"RIG-RVC","section":"App.A","description":"compressed. The default on densities A and B. (228)","declared":228,"declaredHi":228,"note":"","actual":228,"countOk":true,"isPattern":false,"slots":[],"body":"Virtual camera already orbiting on frame one. Slow unbroken lateral orbit with a gentle push, constant rate, mechanically smooth, no handheld physics. Narrow arc, wordmark stays readable, target centred. Still moving at the cut."},{"id":"RIG-RVD","section":"App.A","description":"virtual lateral drift. Mechanism beats where light carries the claim. (484)","declared":484,"declaredHi":484,"note":"","actual":484,"countOk":true,"isPattern":false,"slots":[],"body":"Virtual camera already drifting on the first frame, never static at entry. A slow steady lateral travel across the subject, single direction, constant unhurried speed, mechanically smooth — no rotation around the subject, no orbit, no push, no sway, no handheld physics, no focus hunt, no reaction to anything in the scene. Total travel stays small, roughly a tenth of frame width across the clip. Still drifting on the final frame, the move never completing and never coming to rest."},{"id":"RIG-RVF","section":"App.A","description":"virtual fast push. Density C, and the entry beat of any mechanism run. (291)","declared":291,"declaredHi":291,"note":"","actual":291,"countOk":true,"isPattern":false,"slots":[],"body":"Virtual camera already moving fast on the first frame. Rapid push toward the target structure, short and hard, with a slight lateral arc across it. Mechanically smooth at speed — no sway, no bounce, no handheld physics, no whip. Still travelling on the final frame, the cut landing mid-move."},{"id":"SCENE-REF","section":"App.A","description":"opens the scene description on every non-plate beat in a location; the scene plate is attached to the same call alongside the character reference. (355 as template)","declared":355,"declaredHi":355,"note":"as template","actual":351,"countOk":false,"isPattern":true,"slots":["LOCATION"],"body":"THE SAME [LOCATION] exactly as in the attached scene reference image — [the location's named anchors, stated in one clause] — but seen from a COMPLETELY DIFFERENT CAMERA POSITION: [where the camer into slack folds, the skin thinner and darker. Fine vellus hair along the jawline and upper lip catching the light and casting its own shadow. [AGE-FEATURES]. A sleep crease still faintly visible on one cheek."},{"id":"SKIN-B4","section":"App.A","description":"colour non-uniformity. (186)","declared":186,"declaredHi":186,"note":"","actual":186,"countOk":true,"isPattern":false,"slots":[],"body":"COLOUR IS NEVER UNIFORM — across even a small patch the tone shifts between freckle, capillary pink, pale patch and shadow. No area of this face is one flat colour. Bare skin, no makeup."},{"id":"SKIN-C","section":"App.A","description":"compressed. (392 before substitution)","declared":392,"declaredHi":392,"note":"before substitution","actual":392,"countOk":true,"isPattern":true,"slots":["AGE-FEATURES"],"body":"Real unretouched skin at near-macro fidelity: [AGE-FEATURES], uneven individually resolved pores, vellus hair at the jaw catching the key, oil sheen breaking specular on the T-zone against matte slightly rough cheeks, subsurface redness at nostrils and ear rims, dry lined lips. Every line and pore casts its own tiny shadow under the raking key. Highlights break at pore level, never smooth."},{"id":"SKIN-T","section":"App.A","description":"test-strength zonal skin, medium-close candid seeds only. Substitute [AGE-FEATURES]. (1,033 as template)","declared":1033,"declaredHi":1033,"note":"as template","actual":1033,"countOk":true,"isPattern":true,"slots":["AGE-FEATURES"],"body":"FOREHEAD — greasy, and the light on it does not make one smooth sheen: the sebum highlight is broken into hundreds of separate pinpoint glints with dark pits between them, three deep horizontal creases and a fine crosshatch of smaller ones, individually resolved enlarged pores across the whole brow. NOSE — the roughest zone, pores wide open and clearly individual across the tip and both sides, a patch of dry flaking beside one nostril, two or three broken capillaries, the bridge highlight broken up const SLOT_SOURCES = DATA.slotSources;
const STRINGS = DATA.strings;
const BY_ID = Object.fromEntries(STRINGS.map(s => [s.id, s]));

/* ---------- the checks, ported from the pipeline ---------- */
const KLING_CEILING = 2500;                                    // §37 / E1
const WORD_TABLE = { brisk:{5:9,10:20}, unhurried:{5:8,10:18} }; // §28H
const BEAT_TYPES = ["BR","TH","MECH","PRODUCT","CTA"];
const PRODUCT_STATES = ["absent","worn","held","seated","demo"];
const VISIBILITY = ["CONCEALED","VISIBLE","REVEAL"];
const SLOT_RE = /\[([A-Z][A-Z0-9 \-\/]*)\]/g;
const BRACKET_RE = /\[[^\]]{1,200}\]/g;
const WORD_RE = /[A-Za-z0-9'’\-]+/g;

const minify = s => String(s || "").split(/\s+/).filter(Boolean).join(" ");
const charCount = s => minify(s).length;
const wordCount = s => (String(s || "").match(WORD_RE) || []).length;

function durationFor(words, pace){
  const table = WORD_TABLE[pace] || WORD_TABLE.brisk;
  for (const secs of [5,10]) if (words <= table[secs]) return secs;
  return null;
}
function checkWordBudget(dialogue, duration, pace, talkingWhileDoing){
  if (talkingWhileDoing) pace = "unhurried";              // movement eats tempo
  const words = wordCount(dialogue), table = WORD_TABLE[pace] || WORD_TABLE.brisk;
  if (!table[duration]) return gate("word_budget","FAIL", duration + "s is not a §28H duration",
    "Use 5s or 10s, or split the line (§29)");
  const ceiling = table[duration];
  if (words <= ceiling) return gate("word_budget","PASS", words + " words ≤ " + ceiling + " at " + pace + "/" + duration + "s");
  const suggested = durationFor(words, pace);
  return gate("word_budget","FAIL", words + " words > " + ceiling + " at " + pace + "/" + duration + "s",
    (suggested ? "raise duration to " + suggested + "s (E7)" : "split the line per §29") + " — never squeeze");
}
function checkCharBudget(text, klingDirect){
  const n = charCount(text);
  if (!klingDirect) return gate("char_count","PASS", n + " chars (Higgsfield-routed, no ceiling)");
  if (n <= KLING_CEILING) return gate("char_count","PASS", n + " ≤ " + KLING_CEILING + " minified");
  return gate("char_count","FAIL", n + " > " + KLING_CEILING + " minified",
    "Trim ladder (§37), recount — over by " + (n - KLING_CEILING));
}
function checkPunctuation(dialogue){
  const found = [];
  if (/…|\.\.\./.test(dialogue)) found.push("ellipsis");
  if (/—/.test(dialogue)) found.push("em-dash");
  if (/–/.test(dialogue)) found.push("en-dash");
  if (!found.length) return gate("punctuation","PASS","full stops and commas only");
  return gate("punctuation","FAIL", found.join(", "),
    "Ellipses are banned; em-dashes generate unpredictable holds (§28H)");
}
function closureWord(dialogue){
  const words = String(dialogue || "").match(WORD_RE) || [];
  for (const group of ["mbp","fv"])
    for (const w of words)
      if ([...group].some(ch => w.toLowerCase().includes(ch))) return w;
  return null;
}
function checkSyncAnchor(dialogue, boundMove, closure){
  if (boundMove || closure)
    return gate("sync_anchor","PASS", (boundMove ? "bound move" : "closure word") + ": " + (boundMove || closure));
  const suggestion = closureWord(dialogue);
  return gate("sync_anchor","FAIL","no bound move word and no closure word",
    "Bind a word to a visible move, or set a closure word" + (suggestion ? " (candidate: " + suggestion + ")" : "") + " — §28H");
}
function slotTokens(text){
  const out = []; let m; SLOT_RE.lastIndex = 0;
  while ((m = SLOT_RE.exec(text))) if (!out.includes(m[1])) out.push(m[1]);
  return out;
}
function residualBrackets(text){ return String(text || "").match(BRACKET_RE) || []; }
function gate(name, status, detail, fix){ return {name, status, detail, fix: fix || ""}; }

/* §27 mechanical phrase pass */
function splitScript(script){
  const phrases = []; let n = 0;
  for (const raw of String(script || "").match(/[^.!?]+[.!?]?/g) || []){
    const sentence = raw.trim(); if (!sentence) continue;
    for (const [text, triggers] of splitSentence(sentence)){
      n += 1;
      phrases.push({id:"P-" + String(n).padStart(3,"0"), text, triggers,
                    disposition:"", demo:"", blockedReason:"", blockedSection:"", plant:"", payoff:""});
    }
  }
  return phrases;
}
function splitSentence(sentence){
  const body = sentence.replace(/[.!?]+$/,"");
  if ((body.match(/,/g) || []).length >= 2 && !/\b(and then|because|so that)\b/i.test(body)){
    const items = body.split(/,|\band\b/).map(s => s.trim()).filter(Boolean);
    if (items.length >= 3 && items.every(i => i.split(/\s+/).length <= 4))
      return items.map(i => [i, ["list-item"]]);
  }
  const pieces = sentence.split(/,(?=\s)|\bbut\b|\bthen\b|\bso\b|\bbecause\b/i)
                         .map(s => s.replace(/^[\s,]+|[\s,]+$/g,"")).filter(Boolean);
  if (pieces.length <= 1) return [[sentence, toneFlags(sentence)]];
  return pieces.map(p => {
    const t = ["clause"].concat(toneFlags(p));
    if (p.split(/\s+/).length <= 5) t.push("merge-candidate");
    return [p, t];
  });
}
const PROBLEM_WORDS = ["pain","ache","stiff","worse","struggle","can't","cannot","tired","swollen"];
const SOLUTION_WORDS = ["relief","finally","again","easier","back to","no longer","without"];
function toneFlags(text){
  const low = text.toLowerCase(), flags = [];
  if (PROBLEM_WORDS.some(w => low.includes(w))) flags.push("problem-language");
  if (SOLUTION_WORDS.some(w => low.includes(w))) flags.push("solution-language");
  if (/\b\d+([.,]\d+)?%?\b/.test(text)) flags.push("number");
  if (flags.includes("problem-language") && flags.includes("solution-language")) flags.push("REVIEW:tone-shift");
  return flags;
}

/* §27B dispositions and reconciliation */
function validateDisposition(value){
  if (!value) return "no disposition — silence is not a legal state (§27B)";
  if (/^CUT\b/i.test(value)) return "CUT is withdrawn as an agent disposition; use BLOCKED with its reason (§27B)";
  if (/^(BR|TH|MECH)-\d+[A-Za-z]?$/.test(value)) return null;
  if (/^MERGED→P-\d+$/.test(value)) return null;
  if (value === "BLOCKED") return null;
  return "“" + value + "” is not a §27B disposition (BR-nn · TH-nn · MECH-nn · MERGED→P-nnn · BLOCKED)";
}
function reconcile(phrases){
  const beats = new Set(), merges = [], th = [], unpaid = [];
  let uncovered = 0, blocked = 0;
  const paid = new Set(phrases.filter(p => p.payoff).map(p => p.payoff));
  for (const p of phrases){
    const d = p.disposition;
    if (!d){ uncovered++; continue; }
    if (d === "BLOCKED"){ blocked++; continue; }
    if (d.startsWith("MERGED")){ merges.push(p.id); continue; }
    if (d.startsWith("TH-")) th.push(d);
    beats.add(d);
  }
  for (const p of phrases) if (p.plant && !paid.has(p.plant)) unpaid.push(p.id + "→" + p.plant);
  const ids = phrases.map(p => p.id);
  return {
    first: ids[0] || "P-000", last: ids[ids.length-1] || "P-000",
    beats: beats.size, merges: merges.sort(), th: [...new Set(th)].sort(),
    uncovered, blocked, unpaid: unpaid.sort(),
    delivered: uncovered === 0,
  };
}
function reconLine(r){
  return [
    r.first + "–" + r.last + " → " + r.beats + " beats",
    "merged: " + (r.merges.length ? r.merges.join(", ") : "none"),
    "TH-carried: " + (r.th.length ? r.th.join(", ") : "none"),
    "uncovered: " + r.uncovered,
    "blocked: " + r.blocked,
    "unpaid plants: " + (r.unpaid.length ? r.unpaid.join(", ") : "none"),
  ].join(" · ");
}
function auditPhrases(phrases){
  const problems = [], ids = new Set(phrases.map(p => p.id));
  for (const p of phrases){
    const err = validateDisposition(p.disposition);
    if (err) problems.push([p.id, err]);
    if (p.disposition === "BLOCKED" && !(p.blockedReason && p.blockedSection))
      problems.push([p.id, "BLOCKED carries no reason and section (§27B)"]);
    if (p.disposition.startsWith("MERGED")){
      const target = p.disposition.split("→").pop();
      if (!ids.has(target)) problems.push([p.id, "MERGED into " + target + ", which is not in the inventory"]);
    }
  }
  for (const prefix of ["BR","TH","MECH"]){
    const nums = phrases.filter(p => p.disposition.startsWith(prefix + "-"))
      .map(p => parseInt(p.disposition.split("-")[1], 10)).filter(n => !isNaN(n)).sort((a,b) => a-b);
    if (!nums.length) continue;
    for (let n = nums[0]; n <= nums[nums.length-1]; n++)
      if (!nums.includes(n)) problems.push(["act map", prefix + " numbering has a gap at " + prefix + "-" + String(n).padStart(2,"0") + " (§27B)"]);
  }
  return problems;
}

/* E4 act-map row schema */
const ROW_REQUIRED = ["beat_id","act","type","register","location_id","story_day",
                      "capture_event_id","duration","product_state","visibility"];
function validateRows(rows){
  const problems = [], seen = new Set();
  let carriesProduct = false;
  for (const row of rows){
    const label = row.beat_id || "row";
    for (const f of ROW_REQUIRED)
      if (row[f] === "" || row[f] === undefined || row[f] === null)
        problems.push([label, "missing required field " + f + " (E4)"]);
    if (seen.has(row.beat_id)) problems.push([label, "duplicate beat_id"]);
    seen.add(row.beat_id);
    if (row.type && !BEAT_TYPES.includes(row.type)) problems.push([label, "type “" + row.type + "” is not an E4 beat type"]);
    if (row.product_state && !PRODUCT_STATES.includes(row.product_state)) problems.push([label, "product_state “" + row.product_state + "” is not an E4 value"]);
    if (row.visibility && !VISIBILITY.includes(row.visibility)) problems.push([label, "visibility “" + row.visibility + "” is not an E4 value"]);
    if (row.wardrobe_ref && !row.story_day) problems.push([label, "wardrobe_ref with no story_day (E4)"]);
    if (row.type === "TH" && !row.duration) problems.push([label, "talking head with no duration (§28H gate)"]);
    if ((row.product_state || "absent") !== "absent") carriesProduct = true;
  }
  if (rows.length && !carriesProduct)
    problems.push(["act map", "no beat carries the product — first appearance unlocated (§9, §18 step 5)"]);
  return problems;
}

function renderGates(){
  let scope = "", gates = [];
  if (tab === "beats"){
    const beat = state.beats[selectedBeat] || {};
    const row = state.rows.find(r => r.beat_id === selectedBeat) || {};
    scope = selectedBeat + " — pre-submission (§37, §28H, E1, E5)";
    if (beat.t2i) gates.push(prefix("t2i", checkCharBudget(beat.t2i, !!beat.klingDirect)));
    if (beat.i2v) gates.push(prefix("i2v", checkCharBudget(beat.i2v, true)));
    for (const [label, text] of [["t2i", beat.t2i], ["i2v", beat.i2v]]){
      if (!text) continue;
      const slots = slotTokens(text);
      if (slots.length)
        gates.push(gate(label + ": slots","FAIL", slots.join(", "),
          slots.map(s => "[" + s + "] ← " + (SLOT_SOURCES[s] || "UNDECLARED — not in the E5 manifest")).join(" · ")));
      const brackets = residualBrackets(text).filter(b => !slots.includes(b.slice(1,-1)));
      if (brackets.length)
        gates.push(gate(label + ": brackets","FAIL", brackets.length + " fill instruction(s) left in the prompt",
          brackets.map(b => b.slice(0,54)).join(" · ")));
    }
    if (beat.dialogue){
      gates.push(checkWordBudget(beat.dialogue, Number(beat.duration) || 5, beat.pace || "brisk", !!beat.boundMove));
      gates.push(checkPunctuation(beat.dialogue));
      gates.push(checkSyncAnchor(beat.dialogue, beat.boundMove, beat.closure));
    }
    if (row.product_state === "worn")
      gates.push(gate("slots: worn","QUEUED","[SITE] and [SIDE] are mandatory on a worn beat (E5)",""));
    if ((row.frame_side || "").toLowerCase() === "rear")
      gates.push(gate("slots: rear","QUEUED","[BAND-INNER] and [REAR-PATH] mandatory on a rear beat (E5)",""));
    if (row.type === "TH") for (const n of ["closure_sync","entry_latency","voice_drift"])
      gates.push(gate(n,"QUEUED", QUEUED_NOTES[n], ""));
    if (row.type === "BR") for (const n of ["face_state","broll_cut_delta","scene_hold"])
      gates.push(gate(n,"QUEUED", QUEUED_NOTES[n], ""));
    if (!beat.t2i && !beat.i2v)
      gates.push(gate("delivery","FAIL","no prompt text","A description of a prompt is not a prompt (§16)"));
    if (!beat.line)
      gates.push(gate("line label","FAIL","missing","A prompt delivered without its line label is undelivered (§26)"));
  } else if (tab === "actmap"){
    scope = "Act map — E4 schema and the §14A W4 chain";
    const problems = validateRows(state.rows);
    gates = problems.length
      ? problems.map(([where, msg]) => gate(where, "FAIL", msg, ""))
      : [gate("act map","PASS", state.rows.length + " rows clean", "")];
  } else if (tab === "strings"){
    scope = "Appendix A — E10 count check";
    const drifted = STRINGS.filter(s => !s.countOk);
    gates = [
      gate("strings","PASS", STRINGS.length + " strings parsed from the Standards",""),
      gate("counts", drifted.length ? "FAIL" : "PASS",
        drifted.length ? drifted.length + " declared counts no longer match their block" : "every count matches",
        drifted.length ? drifted.slice(0,6).map(s => s.id).join(", ") + (drifted.length > 6 ? " …" : "") : ""),
      gate("patterns","PASS", STRINGS.filter(s => s.isPattern).length + " PATTERN strings carry slots",""),
    ];
  } else {
    scope = "Coverage — §27B";
    const r = reconcile(state.phrases);
    const problems = auditPhrases(state.phrases);
    gates = [
      gate("uncovered", r.uncovered === 0 ? "PASS" : "FAIL", r.uncovered + " phrase(s) without a disposition",
        r.uncovered ? "Uncovered must read zero or the act is undelivered (§27B)" : ""),
      gate("blocked", r.blocked ? "WARN" : "PASS", r.blocked + " BLOCKED",
        r.blocked ? "Reported, never resolved — the advertiser moves it (§27B)" : ""),
      gate("plants", r.unpaid.length ? "FAIL" : "PASS",
        r.unpaid.length ? r.unpaid.join(", ") : "no unpaid plants", ""),
    ].concat(problems.map(([where, msg]) => gate(where, "FAIL", msg, "")));
  }
  $("gateScope").textContent = scope;
  $("gateList").innerHTML = gates.map(g =>
    '<div class="gate"><span class="st ' + g.status + '">' + g.status + '</span>' +
    '<span><span class="nm">' + esc(g.name) + '</span>' +
    '<span class="dt"> — ' + esc(g.detail) + '</span>' +
    (g.fix ? '<div class="fx">→ ' + esc(g.fix) + '</div>' : '') + '</span></div>').join("")
    || '<p class="empty">Nothing to gate yet.</p>';
}
const QUEUED_NOTES = {
  closure_sync: "frame-step at the closure and stress word — HUMAN (E1)",
  entry_latency: "silence detection at −40 dB, first word ≤ 0.5s — no instrument here (E1)",
  voice_drift: "pitch median + tempo vs act baseline, ±15% — no instrument here (E1)",
  face_state: "first frame vs FACE/NOFACE header — HUMAN (E1)",
  broll_cut_delta: "luminance delta at the cut vs the TH baseline — no instrument here (E1)",
  scene_hold: "first frame vs the Location Sheet — HUMAN (E1)",
};
function prefix(label, g){ return gate(label + ": " + g.name, g.status, g.detail, g.fix); }

/* ---------- wiring ---------- */
function render(){ renderSteps(); renderTabs(); renderPane(); renderGates(); renderChips(); }
function renderChips(){
  $("verChip").textContent = "Standards V" + DATA.version;
  $("verFoot").textContent = "V" + DATA.version;
  $("exampleChip").hidden = !state.isExample;
  const chip = $("saveChip");
  if (!db){ chip.textContent = "local only"; chip.className = "chip"; }
  else if (writing || dirty){ chip.textContent = "saving…"; chip.className = "chip warn"; }
  else { chip.textContent = "saved"; chip.className = "chip ok"; }
}

function touch(){ state.isExample = false; dirty = true; renderChips(); scheduleSave(); }

function wirePane(){
  const pane = $("pane");
  const splitBtn = $("splitBtn");
  if (splitBtn) splitBtn.addEventListener("click", () => {
    const kept = Object.fromEntries(state.phrases.map(p => [p.id, p]));
    state.script = $("scriptBox").value;
    state.phrases = splitScript(state.script).map(p => {
      const old = kept[p.id];
      if (old && old.text === p.text)
        return Object.assign(p, {disposition: old.disposition, demo: old.demo,
          blockedReason: old.blockedReason, blockedSection: old.blockedSection});
      return p;
    });
    tab = "phrases"; touch(); render();
  });
  const box = $("scriptBox");
  if (box) box.addEventListener("input", () => { state.script = box.value; touch(); });

  pane.querySelectorAll("[data-phrase]").forEach(el => {
    el.addEventListener("input", () => {
      const p = state.phrases.find(x => x.id === el.dataset.phrase);
      if (!p) return;
      p[el.dataset.field] = el.value;
      touch(); renderGates();
    });
    el.addEventListener("change", () => { render(); refocus(el); });
  });

  pane.querySelectorAll("[data-row]").forEach(el => {
    el.addEventListener("input", () => {
      const row = state.rows[Number(el.dataset.row)];
      if (!row) return;
      row[el.dataset.field] = el.dataset.field === "duration" ? (el.value === "" ? "" : Number(el.value)) : el.value;
      touch(); renderGates();
    });
    el.addEventListener("change", () => { renderGates(); renderSteps(); });
  });
  pane.querySelectorAll("[data-drop]").forEach(el => el.addEventListener("click", () => {
    state.rows.splice(Number(el.dataset.drop), 1); touch(); render();
  }));
  const sync = $("syncRows");
  if (sync) sync.addEventListener("click", () => {
    const wanted = [...new Set(state.phrases.map(p => p.disposition)
      .filter(d => /^(BR|TH|MECH)-\d+/.test(d)))].sort();
    const existing = Object.fromEntries(state.rows.map(r => [r.beat_id, r]));
    state.rows = wanted.map(id => existing[id] || {
      beat_id: id, act: "1", type: id.split("-")[0] === "MECH" ? "MECH" : id.split("-")[0],
      register: "", rig: "", location_id: "", story_day: "", capture_event_id: "",
      duration: 5, product_state: "absent", visibility: "CONCEALED", wardrobe_ref: "",
      frame_side: "", framing_step: "",
    });
    touch(); render();
  });
  const add = $("addRow");
  if (add) add.addEventListener("click", () => {
    state.rows.push({beat_id: "", act: "1", type: "BR", register: "", rig: "", location_id: "",
      story_day: "", capture_event_id: "", duration: 5, product_state: "absent",
      visibility: "CONCEALED", wardrobe_ref: "", frame_side: "", framing_step: ""});
    touch(); render();
  });

  pane.querySelectorAll("[data-beat]").forEach(el => el.addEventListener("click", () => {
    selectedBeat = el.dataset.beat; render();
  }));
  pane.querySelectorAll("[data-beat-field]").forEach(el => {
    const apply = () => {
      const beat = state.beats[selectedBeat] || (state.beats[selectedBeat] = {});
      const field = el.dataset.beatField;
      let value = el.value;
      if (field === "klingDirect") value = el.value === "true";
      if (field === "duration") value = Number(el.value);
      beat[field] = value;
      touch(); renderGates(); updateCounts();
    };
    el.addEventListener("input", apply);
    el.addEventListener("change", apply);
  });

  const search = $("sSearch"), patterns = $("sPattern");
  if (search){
    renderStringList();
    search.addEventListener("input", renderStringList);
    patterns.addEventListener("change", renderStringList);
    $("slist").addEventListener("click", e => {
      const t2i = e.target.closest("[data-insert]"), i2v = e.target.closest("[data-insert-i2v]");
      if (!t2i && !i2v) return;
      const id = (t2i || i2v).dataset.insert || (t2i || i2v).dataset.insertI2v;
      const block = BY_ID[id]; if (!block) return;
      const beat = state.beats[selectedBeat] || (state.beats[selectedBeat] = {});
      const field = t2i ? "t2i" : "i2v";
      beat[field] = (beat[field] ? beat[field].replace(/\s*$/,"") + "\n\n" : "") + block.body;
      touch();
      tab = "beats"; render();
    });
  }
}
function updateCounts(){
  const beat = state.beats[selectedBeat] || {};
  document.querySelectorAll(".editor").forEach(ed => {
    const area = ed.querySelector("textarea"); if (!area) return;
    const field = area.dataset.beatField, count = ed.querySelector(".count");
    if (!count) return;
    if (field === "dialogue") count.textContent = wordCount(beat.dialogue) + " words";
    else {
      const n = charCount(beat[field]);
      count.textContent = n + " chars";
      const over = (field === "i2v" || beat.klingDirect) && n > KLING_CEILING;
      count.classList.toggle("bad", over);
    }
  });
}
function refocus(el){
  const sel = "[data-phrase='" + el.dataset.phrase + "'][data-field='" + el.dataset.field + "']";
  const next = document.querySelector(sel);
  if (next){ next.focus(); try { next.setSelectionRange(next.value.length, next.value.length); } catch (e) {} }
}

$("tabs").addEventListener("click", e => {
  const btn = e.target.closest("[data-tab]"); if (!btn) return;
  tab = btn.dataset.tab; render();
});
$("resetBtn").addEventListener("click", () => {
  if (!confirm("Replace the current build with the example? Anything unsaved is lost.")) return;
  state = exampleBuild(); selectedBeat = "BR-06"; tab = "phrases"; dirty = true; scheduleSave(); render();
});
$("exportBtn").addEventListener("click", exportBuild);

/* ---------- export (E9 file names, so it drops into a build tree) ---------- */
async function exportBuild(){
  const files = {
    "phrase_inventory.json": JSON.stringify({phrases: state.phrases.map(p => ({
      id: p.id, text: p.text, triggers: p.triggers, disposition: p.disposition, demo: p.demo,
      blocked_reason: p.blockedReason, blocked_section: p.blockedSection,
      plant: p.plant || "", payoff: p.payoff || "",
    }))}, null, 2),
    "act_map.json": JSON.stringify({declared: state.declared, rows: state.rows}, null, 2),
    "script.txt": state.script,
  };
  for (const [id, beat] of Object.entries(state.beats)){
    if (beat.t2i) files["beats/" + id + ".t2i.txt"] = beat.t2i;
    if (beat.i2v) files["beats/" + id + ".i2v.json"] = beat.i2v;
  }
  const bundle = JSON.stringify({
    build: state.name, standards: DATA.version,
    reconciliation: reconLine(reconcile(state.phrases)),
    files,
  }, null, 2);
  const downloads = await claude.use("downloads").catch(() => null);
  if (downloads){
    try {
      await downloads.save({filename: slug(state.name) + "-build.json", data: bundle});
      return;
    } catch (e){ /* viewer declined or unavailable — fall through to the copy path */ }
  }
  try {
    await navigator.clipboard.writeText(bundle);
    alert("Build copied to the clipboard as JSON — paste it into your build tree.");
  } catch (e){
    alert("Could not save or copy the build here. Open the console tab and copy it from the log.");
    console.log(bundle);
  }
}
const slug = s => String(s || "build").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "build";

/* ---------- persistence ---------- */
function snapshot(){
  return {
    name: state.name, script: state.script, phrases: state.phrases,
    rows: state.rows, declared: state.declared, isExample: !!state.isExample,
    updatedAt: new Date().toISOString(),
  };
}
function scheduleSave(){
  if (!db) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 700);
}
async function save(){
  if (!db || writing) return;
  writing = true; dirty = false; renderChips();
  try {
    await db.doc("builds/main").set(snapshot());
    const beats = db.doc("builds/main").collection("beats");
    for (const [id, beat] of Object.entries(state.beats))
      await beats.doc(id).set(Object.assign({}, beat, {beat_id: id}));
  } catch (e){
    dirty = true;
  } finally {
    writing = false; renderChips();
    if (dirty) scheduleSave();
  }
}

(async function boot(){
  render();
  const capability = window.claude && window.claude.use ? await window.claude.use("db").catch(() => null) : null;
  if (!capability) { renderChips(); return; }
  db = capability;
  try {
    const doc = await db.doc("builds/main").get();
    if (doc.exists){
      const saved = doc.data();
      state.name = saved.name || state.name;
      state.script = saved.script || "";
      state.phrases = saved.phrases || [];
      state.rows = saved.rows || [];
      state.declared = saved.declared || {};
      state.isExample = false;
      const beats = await db.doc("builds/main").collection("beats").get();
      state.beats = {};
      beats.docs.forEach(d => { state.beats[d.id] = d.data(); });
      const ids = Object.keys(state.beats);
      if (ids.length) selectedBeat = ids.sort()[0];
    }
  } catch (e){ /* keep the example build; the page works without the store */ }
  render();
})();
</script>
